<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16213E">
<title>Rota: İngilizce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F9;--card:#FFFFFF;--ink:#16213E;--mut:#5F6B85;--rule:#DCE1EC;--soft:#E8ECF4;
  --ok:#128A5C;--okbg:#DBF4E8;--bad:#D23B42;--badbg:#FCE3E4;
  --a1:#17A06C;--a2:#2E6FE6;--b1:#D98300;--b2:#C8336C;--lc:var(--a1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#0D1322;--card:#172036;--ink:#E7ECF7;--mut:#98A3BC;--rule:#28324C;--soft:#1F2942;--okbg:#0F3A2A;--badbg:#44191D;--ok:#3CCB8E;--bad:#FF6B72}
}
:root[data-theme="dark"]{--paper:#0D1322;--card:#172036;--ink:#E7ECF7;--mut:#98A3BC;--rule:#28324C;--soft:#1F2942;--okbg:#0F3A2A;--badbg:#44191D;--ok:#3CCB8E;--bad:#FF6B72}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,.fcard:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.muted{color:var(--mut)}
.small{font-size:.875rem}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.logo{font:800 22px "Bricolage Grotesque",system-ui,sans-serif;display:flex;align-items:center;gap:8px;margin-right:auto}
.logo svg{width:28px;height:28px}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.95rem;padding:6px 10px;border-radius:999px;background:var(--card);border:1px solid var(--rule)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--rule)}
.iconbtn svg{width:20px;height:20px}

main{padding:16px 0 calc(96px + env(safe-area-inset-bottom,0px))}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:.75rem;font-weight:600;color:var(--mut)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--a2)}

/* hero */
.hero{background:var(--ink);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden;margin-bottom:22px}
:root[data-theme="dark"] .hero{background:#1E2A48}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:#1E2A48}}
.hero p{margin:0;opacity:.8;font-size:.9rem}
.hero h1{font-size:1.75rem;line-height:1.15;margin:6px 0 4px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.hero .meta span{background:rgba(255,255,255,.12);border-radius:8px;padding:4px 9px;font-size:.85rem;font-weight:600}
.hero .track{display:flex;gap:3px;margin-top:16px}
.hero .track i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.hero .track i.on{background:var(--c)}
.hero .tracklab{display:flex;justify-content:space-between;font-size:.78rem;opacity:.75;margin-top:6px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font-weight:700;font-size:1.02rem;padding:12px 18px;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--lc);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--lc) 70%,#000)}
.btn.pri:active{box-shadow:0 2px 0 color-mix(in srgb,var(--lc) 70%,#000)}
.btn.pri[disabled]{background:var(--soft);color:var(--mut);box-shadow:none;cursor:default}
.btn.light{background:#fff;color:#16213E;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--card);border:2px solid var(--rule);color:var(--ink)}
.btn.okb{background:var(--ok);color:#fff}
.btn.badb{background:var(--bad);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* route map */
.lv{--lc:var(--a1);margin-bottom:26px}
.lvh{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.lvb{width:54px;height:54px;border-radius:15px;background:var(--lc);color:#fff;display:grid;place-items:center;font:800 1.35rem "Bricolage Grotesque",sans-serif;flex:none}
.lvh h2{font-size:1.25rem}
.lvh p{margin:0;font-size:.88rem;color:var(--mut)}
.lvh .cnt{margin-left:auto;font-weight:700;font-size:.9rem;color:var(--mut)}
.stops{margin-top:8px}
.stop{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:7px 0;position:relative}
.stop::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:6px;background:var(--lc);opacity:.22}
.stop:first-child::before{top:50%}
.stop:last-child::before{bottom:50%}
.stop.done::before{opacity:1}
.dot{position:relative;z-index:1;flex:none;width:52px;height:52px;border-radius:50%;border:6px solid var(--lc);background:var(--card);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.stop.done .dot{background:var(--lc);color:#fff}
.stop.lock .dot{border-color:var(--rule);color:var(--mut)}
.stop.cur .dot{box-shadow:0 0 0 0 color-mix(in srgb,var(--lc) 55%,transparent);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 14px transparent}100%{box-shadow:0 0 0 0 transparent}}
.stc{flex:1;min-width:0;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.stop.cur .stc{border:2px solid var(--lc)}
.stop.lock .stc{opacity:.62}
.stc small{display:block;color:var(--mut);font-size:.78rem;font-weight:600}
.stc b{display:block;font-weight:700;line-height:1.3}
.stc .em{font-size:1.5rem;flex:none}
.stars{margin-left:auto;display:flex;gap:1px;flex:none;font-size:.9rem;color:#F2B01E}
.stars .off{color:var(--rule)}

/* page headers */
.ph{margin-bottom:14px}
.ph h1{font-size:1.9rem}
.ph p{margin:4px 0 0;color:var(--mut)}
.search{width:100%;height:50px;border-radius:14px;border:2px solid var(--rule);background:var(--card);color:var(--ink);font:inherit;padding:0 16px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--rule);font-weight:600;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;--lc:var(--a2)}
.acts .btn{min-height:46px;font-size:.95rem}
.grp{font-size:1.05rem;margin:18px 0 8px}
.wl{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--rule);border-radius:16px;overflow:hidden}
.wl li{display:flex;align-items:center;gap:12px;padding:11px 12px 11px 14px;border-top:1px solid var(--rule)}
.wl li:first-child{border-top:0}
.wl .en{font-weight:700}
.wl .tr{color:var(--mut);font-size:.93rem}
.wl .tx{flex:1;min-width:0}
.spk{flex:none;width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.spk svg{width:20px;height:20px}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}

/* review page */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px}
.stat b{display:block;font:800 1.7rem "Bricolage Grotesque",sans-serif}
.stat span{color:var(--mut);font-size:.88rem}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px;margin-bottom:10px}
.mode .mi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;flex:none;background:var(--soft)}
.mode b{display:block}
.mode span{color:var(--mut);font-size:.9rem}
.mode[disabled]{opacity:.5}
.lvbar{margin-bottom:10px}
.lvbar .lt{display:flex;justify-content:space-between;font-weight:600;font-size:.9rem;margin-bottom:4px}
.lvbar .bb{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.lvbar .bb i{display:block;height:100%;background:var(--c);border-radius:5px}

/* stage (lesson player) */
#stage{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.st-top,.st-body,.st-foot{width:100%;max-width:620px;margin:0 auto}
.st-top{display:flex;align-items:center;gap:12px;padding:12px 16px}
.st-top .x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;color:var(--mut)}
.bar{flex:1;height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lc);border-radius:7px;transition:width .35s ease}
.tmr{font:800 1.1rem "Bricolage Grotesque",sans-serif;min-width:44px;text-align:right}
.st-body{flex:1;overflow-y:auto;padding:8px 16px 24px;-webkit-overflow-scrolling:touch}
.st-foot{padding:10px 16px 16px;display:flex;gap:10px}
.q-ask{font:700 1.3rem "Bricolage Grotesque",sans-serif;margin:8px 0 16px}
.q-big{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:2px solid var(--rule);border-radius:18px;padding:22px 18px;font:800 1.7rem "Bricolage Grotesque",sans-serif;margin-bottom:18px;word-break:break-word}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;min-height:56px;padding:12px 16px;border-radius:14px;background:var(--card);border:2px solid var(--rule);border-bottom-width:4px;font-weight:600;font-size:1.05rem}
.opt:active{transform:translateY(1px)}
.opt.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.opt.dim{opacity:.55}
.intro .lvb{margin-bottom:12px}
.intro h2{font-size:2rem;line-height:1.1;margin:2px 0 14px}
.learn{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.learn span{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:6px 11px;font-size:.92rem}
.tipbox{background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--lc);border-radius:14px;padding:16px}
.tipbox h3{font-size:1.05rem;margin-bottom:6px}
.tipbox p{margin:0;line-height:1.6}
.tipbox b{color:var(--lc)}
.fcard{perspective:1000px;height:260px;margin:4px 0 16px;cursor:pointer}
.fin{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fcard.flip .fin{transform:rotateY(180deg)}
.ff,.fbk{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ff{background:var(--card);border:2px solid var(--rule);border-bottom-width:6px}
.fbk{background:var(--lc);color:#fff;transform:rotateY(180deg)}
.fen{font:800 2.1rem "Bricolage Grotesque",sans-serif;line-height:1.1;word-break:break-word}
.ftr{font:800 1.8rem "Bricolage Grotesque",sans-serif;line-height:1.15}
.fbk .fen2{opacity:.85}
.hint{color:var(--mut);font-size:.88rem}
.fctl{display:flex;justify-content:center;gap:12px}
.fctl button{width:56px;height:56px;border-radius:16px;background:var(--card);border:2px solid var(--rule);display:grid;place-items:center;font-size:1.3rem}
.fctl svg{width:24px;height:24px}
.pcard{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;transition:outline-color .15s}
.pcard .tx{flex:1}
.pcard .en{font-weight:700;font-size:1.08rem}
.pcard .tr{color:var(--mut)}
.pcard.play{outline:3px solid var(--lc)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:10px}
.mt{min-height:60px;padding:8px 10px;border-radius:14px;background:var(--card);border:2px solid var(--rule);border-bottom-width:4px;font-weight:600;font-size:.98rem;line-height:1.25;word-break:break-word}
.mt.sel{border-color:var(--a2);background:color-mix(in srgb,var(--a2) 12%,var(--card))}
.mt.done{border-color:var(--ok);background:var(--okbg);color:var(--ok);opacity:.55;pointer-events:none}
.mt.no{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.listen{display:flex;gap:12px;justify-content:center;margin:6px 0 22px}
.bigspk{width:104px;height:104px;border-radius:28px;background:var(--lc);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--lc) 70%,#000)}
.bigspk svg{width:48px;height:48px}
.slowb{width:72px;height:104px;border-radius:24px;background:var(--card);border:2px solid var(--rule);font-size:1.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.slowb span{font-size:.72rem;font-weight:700;color:var(--mut)}
.q-sent{background:var(--card);border:2px solid var(--rule);border-radius:16px;padding:18px;font:700 1.3rem "Bricolage Grotesque",sans-serif;line-height:1.4;margin-bottom:8px}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--lc);color:var(--lc)}
.q-tr{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;font-weight:600;margin-bottom:14px}
.ans{min-height:112px;border-bottom:2px solid var(--rule);display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:6px 0 12px;margin-bottom:16px;background:repeating-linear-gradient(transparent 0 52px,var(--rule) 52px 54px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wchip{padding:10px 14px;border-radius:12px;background:var(--card);border:2px solid var(--rule);border-bottom-width:4px;font-weight:600;font-size:1.02rem}
.wchip.used{visibility:hidden}
.dlg{display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;text-align:left;padding:11px 14px;border-radius:18px;background:var(--card);border:1px solid var(--rule);font-weight:600;line-height:1.4}
.bub.a{align-self:flex-start;border-bottom-left-radius:5px}
.bub.b{align-self:flex-end;border-bottom-right-radius:5px;background:color-mix(in srgb,var(--lc) 14%,var(--card));border-color:color-mix(in srgb,var(--lc) 35%,var(--rule))}
.bub .who{display:block;font-size:.72rem;font-weight:800;color:var(--mut)}
.bub .tr{display:none;font-weight:500;color:var(--mut);font-size:.92rem;margin-top:4px}
.bub.show .tr,.dlg.alltr .tr{display:block}
.bub.play{outline:3px solid var(--lc)}
.tgl{font-weight:700;color:var(--a2);font-size:.92rem;margin-bottom:12px}
.fb{position:absolute;left:0;right:0;bottom:0;z-index:5;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.fbi{max-width:620px;margin:0 auto;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
.fbi.ok{background:var(--okbg);color:var(--ok)}
.fbi.bad{background:var(--badbg);color:var(--bad)}
.fbi.neu{background:var(--card);border-top:1px solid var(--rule)}
.fbi h3{font-size:1.35rem;display:flex;align-items:center;gap:8px}
.fbi p{margin:4px 0 0;font-weight:600}
.fbi .pair{color:var(--ink);opacity:.8;font-weight:500}
.fbi .btn{margin-top:14px}
.res{text-align:center;padding-top:30px}
.res .bigstars{font-size:3.2rem;letter-spacing:6px;color:#F2B01E}
.res .bigstars .off{color:var(--rule)}
.res h2{font-size:2rem;margin:10px 0 6px}
.res .rs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.res .rs div{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:12px 6px}
.res .rs b{display:block;font:800 1.5rem "Bricolage Grotesque",sans-serif}
.res .rs span{font-size:.8rem;color:var(--mut)}
.col{display:grid;gap:10px;width:100%}
.spdq{text-align:center}
.spdscore{font:800 3rem "Bricolage Grotesque",sans-serif;color:var(--lc)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sbg{position:absolute;inset:0;background:rgba(10,15,30,.5)}
.scard{position:relative;width:100%;max-width:620px;max-height:88%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
.grab{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 14px}
.scard h2{font-size:1.5rem;margin-bottom:6px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 18px}
.wchips span{background:var(--soft);border-radius:8px;padding:4px 9px;font-size:.88rem;font-weight:600}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--rule)}
.set b{display:block}
.set span{color:var(--mut);font-size:.88rem}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;flex:none}
.seg button{padding:7px 11px;border-radius:9px;font-weight:600;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw{width:52px;height:30px;border-radius:15px;background:var(--rule);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--a1)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.danger{color:var(--bad);font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){.q-big{font-size:2rem}.fcard{height:300px}}

.hero .track i{background:linear-gradient(90deg,var(--c) var(--p),rgba(255,255,255,.18) var(--p))}
.stop.exam .dot{font-size:1.25rem;border-style:double;border-width:7px}
.stop.exam .stc{border-style:dashed;border-width:2px;border-color:color-mix(in srgb,var(--lc) 55%,var(--rule))}
.stop.exam.done .stc{border-style:solid}
.escore{margin-left:auto;font-weight:800;font-size:.9rem;padding:4px 9px;border-radius:9px;background:var(--soft);color:var(--mut)}
.escore.ok{background:color-mix(in srgb,var(--lc) 16%,var(--card));color:var(--lc)}
.cando{background:color-mix(in srgb,var(--lc) 10%,var(--card));border-radius:12px;padding:11px 13px;margin:0 0 14px;line-height:1.5;font-size:.97rem}
.ctx{display:inline-block;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--mut);margin-bottom:8px}

const RAW=[
["A1","Merhaba!","👋",`<b>Hi</b> arkadaşça, <b>Hello</b> her yerde kullanılır. <b>How are you?</b> sorusuna kısa cevap verilir: <i>I'm fine, thanks. And you?</i> Sabah <b>Good morning</b>, akşam <b>Good evening</b> denir. <b>Good night</b> sadece vedalaşırken ya da yatarken kullanılır.`,
`hello=merhaba|hi=selam|goodbye=hoşça kal|bye=görüşürüz|good morning=günaydın|good evening=iyi akşamlar|good night=iyi geceler|thank you=teşekkür ederim|please=lütfen|yes=evet|no=hayır|sorry=özür dilerim`,
`How are you?=Nasılsın?|I'm fine, thanks. And you?=İyiyim, teşekkürler. Ya sen?|Nice to meet you.=Tanıştığıma memnun oldum.|See you later.=Sonra görüşürüz.|Have a nice day!=İyi günler!`,
`A:Hi! I'm Emma.=Selam! Ben Emma.|B:Hello Emma, I'm Can.=Merhaba Emma, ben Can.|A:Nice to meet you, Can.=Tanıştığıma memnun oldum Can.|B:Nice to meet you too. How are you?=Ben de memnun oldum. Nasılsın?|A:I'm fine, thanks. And you?=İyiyim, teşekkürler. Ya sen?|B:Great! See you later.=Harika! Sonra görüşürüz.`],
["A1","Ben kimim?","🙋",`<b>to be</b> = olmak. I → <b>am</b>, he/she/it → <b>is</b>, you/we/they → <b>are</b>. Kısaltmalar: <i>I'm, you're, he's, she's, we're, they're</i>. Olumsuz: <i>I'm not, he isn't</i>. Soru için fiil başa gelir: <i>Are you a student?</i>`,
`I=ben|you=sen, siz|he=o (erkek)|she=o (kadın)|it=o (nesne)|we=biz|they=onlar|name=isim|student=öğrenci|teacher=öğretmen|friend=arkadaş|from=-den, -dan`,
`My name is Ali.=Benim adım Ali.|I am from Turkey.=Türkiyeliyim.|Where are you from?=Nerelisin?|She is a teacher.=O bir öğretmen.|We are friends.=Biz arkadaşız.|Are you a student?=Öğrenci misin?`,
`A:What's your name?=Adın ne?|B:My name is Deniz.=Adım Deniz.|A:Where are you from, Deniz?=Nerelisin Deniz?|B:I'm from Istanbul. And you?=İstanbul'danım. Ya sen?|A:I'm from London. I'm a teacher.=Londra'danım. Öğretmenim.|B:Oh, cool! I'm a student.=Ah, ne güzel! Ben öğrenciyim.`],
["A1","Sayılar ve yaş","🔢",`Yaş söylerken <b>I am 25 (years old)</b> denir, <i>I have 25</i> değil! Fiyat için <b>How much?</b>, adet için <b>How many?</b> sorulur. 13-19 arası sayılar <b>-teen</b> (thirteen), onluklar <b>-ty</b> (twenty, thirty) ile biter.`,
`one=bir|two=iki|three=üç|five=beş|ten=on|twelve=on iki|fifteen=on beş|twenty=yirmi|hundred=yüz|thousand=bin|age=yaş|number=numara, sayı`,
`How old are you?=Kaç yaşındasın?|I am 25 years old.=25 yaşındayım.|What's your phone number?=Telefon numaran ne?|It costs ten dollars.=On dolar tutuyor.|How many people?=Kaç kişi?`,
`A:How old are you?=Kaç yaşındasın?|B:I'm twenty-eight. And you?=Yirmi sekiz. Ya sen?|A:I'm thirty. What's your phone number?=Otuz. Telefon numaran ne?|B:It's 0532 415 20 18.=0532 415 20 18.|A:Thanks! I'll text you.=Teşekkürler! Sana mesaj atarım.`],
["A1","Ailem","👨‍👩‍👧",`Sahiplik: I/you/we/they <b>have</b>, he/she/it <b>has</b>. Soru: <i>Do you have ...? / Does she have ...?</i> İyelik: <b>my</b> (benim), <b>your</b> (senin), <b>his</b> (onun, erkek), <b>her</b> (onun, kadın), <b>our</b> (bizim), <b>their</b> (onların).`,
`family=aile|mother=anne|father=baba|brother=erkek kardeş|sister=kız kardeş|son=oğul|daughter=kız evlat|wife=eş (kadın)|husband=eş (erkek)|child=çocuk|children=çocuklar|parents=ebeveynler`,
`I have a brother.=Bir erkek kardeşim var.|She has two children.=Onun iki çocuğu var.|This is my mother.=Bu benim annem.|Do you have a sister?=Kız kardeşin var mı?|My parents live in Ankara.=Annemle babam Ankara'da yaşıyor.`,
`A:Do you have any brothers or sisters?=Hiç kardeşin var mı?|B:Yes, I have one sister. She's a doctor.=Evet, bir kız kardeşim var. Doktor.|A:Nice! Is she older than you?=Güzel! Senden büyük mü?|B:No, she's younger. What about you?=Hayır, küçük. Ya sen?|A:I have two brothers.=İki erkek kardeşim var.`],
["A1","Günlük rutin","⏰",`Geniş zaman (Present Simple) alışkanlıkları anlatır. he/she/it ile fiile <b>-s</b> eklenir: <i>I work → she works</i>. Olumsuz: <b>don't / doesn't</b> + fiil. Sıklık zarfları fiilden önce gelir: <i>I <b>usually</b> get up at 7.</i>`,
`wake up=uyanmak|get up=kalkmak|breakfast=kahvaltı|lunch=öğle yemeği|dinner=akşam yemeği|go to work=işe gitmek|come home=eve gelmek|eat=yemek yemek|drink=içmek|sleep=uyumak|every day=her gün|shower=duş`,
`I wake up at seven.=Yedide uyanırım.|I go to work by bus.=İşe otobüsle giderim.|She drinks coffee every morning.=O her sabah kahve içer.|I don't eat meat.=Et yemem.|What time do you get up?=Kaçta kalkarsın?`,
`A:What time do you get up?=Kaçta kalkarsın?|B:I usually get up at seven.=Genelde yedide kalkarım.|A:Do you have breakfast?=Kahvaltı yapar mısın?|B:Yes, I always have eggs and tea.=Evet, hep yumurta ve çay.|A:I never have breakfast. I just drink coffee.=Ben hiç kahvaltı yapmam. Sadece kahve içerim.|B:That's not healthy!=Bu sağlıklı değil!`],
["A1","Saat ve günler","📅",`Saat sorarken <b>What time is it?</b> Tam saat: <i>It's five o'clock</i>. Buçuk: <i>half past five</i> (5:30). Günlerle <b>on</b> (on Monday), saatlerle <b>at</b> (at 3 pm), ay ve yıllarla <b>in</b> (in May) kullanılır.`,
`time=zaman, saat|o'clock=saat (tam)|half past=buçuk|Monday=pazartesi|Wednesday=çarşamba|Friday=cuma|Sunday=pazar|weekend=hafta sonu|today=bugün|tomorrow=yarın|yesterday=dün|week=hafta`,
`What time is it?=Saat kaç?|It's three o'clock.=Saat üç.|See you on Monday.=Pazartesi görüşürüz.|I'm free at the weekend.=Hafta sonu boşum.|The meeting is at half past ten.=Toplantı on buçukta.`,
`A:Excuse me, what time is it?=Affedersiniz, saat kaç?|B:It's half past two.=İki buçuk.|A:Thanks! Is the shop open on Sunday?=Teşekkürler! Mağaza pazar açık mı?|B:No, only Monday to Saturday.=Hayır, sadece pazartesiden cumartesiye.|A:OK, I'll come tomorrow then.=Tamam, o zaman yarın gelirim.`],
["A1","Kafede","☕",`Sipariş verirken en kibar kalıplar: <b>Can I have ...?</b> ve <b>I'd like ...</b> (I would like = isterim). <i>I want</i> kaba kaçabilir. Fiyat için <b>How much is it?</b>, hesap için <b>The bill, please</b> (Amerika'da <i>check</i>).`,
`coffee=kahve|tea=çay|water=su|sandwich=sandviç|menu=menü|bill=hesap|table=masa|cheap=ucuz|expensive=pahalı|delicious=lezzetli|hungry=aç|thirsty=susamış`,
`Can I have a coffee, please?=Bir kahve alabilir miyim lütfen?|I'd like the menu, please.=Menüyü rica ediyorum.|The bill, please.=Hesap lütfen.|How much is it?=Ne kadar?|For here or to go?=Burada mı, paket mi?|It's delicious!=Çok lezzetli!`,
`A:Hi! What can I get you?=Merhaba! Ne alırsınız?|B:Can I have a latte, please?=Bir latte alabilir miyim lütfen?|A:Sure. For here or to go?=Tabii. Burada mı paket mi?|B:To go, please. How much is it?=Paket lütfen. Ne kadar?|A:It's four fifty.=Dört elli.|B:Here you go. Thanks!=Buyurun. Teşekkürler!`],
["A1","Yol tarifi","🧭",`Yer sorarken <b>Where is ...?</b> ya da daha kibar <b>Is there a ... near here?</b> (Yakında ... var mı?). Yönler: <i>turn left/right</i> (sola/sağa dön), <i>go straight</i> (düz git), <b>next to</b> (yanında), <b>opposite</b> (karşısında).`,
`street=sokak, cadde|left=sol|right=sağ|straight=düz|near=yakın|far=uzak|station=istasyon|bank=banka|hospital=hastane|pharmacy=eczane|turn=dönmek|next to=yanında`,
`Where is the station?=İstasyon nerede?|Go straight.=Düz git.|Turn left.=Sola dön.|It's near here.=Buraya yakın.|Is there a pharmacy near here?=Yakında eczane var mı?|It's next to the bank.=Bankanın yanında.`,
`A:Excuse me, is there a pharmacy near here?=Affedersiniz, yakında eczane var mı?|B:Yes. Go straight and turn right.=Evet. Düz gidin ve sağa dönün.|A:Is it far?=Uzak mı?|B:No, about five minutes. It's next to the bank.=Hayır, beş dakika kadar. Bankanın yanında.|A:Thank you so much!=Çok teşekkürler!|B:You're welcome.=Rica ederim.`],
["A1","Telefon ve bilgisayar","📱",`Teknoloji kelimelerinin çoğu Türkçeye geçmiştir ama telaffuz farklıdır: <i>app</i> "ep", <i>download</i> "daunlod" gibi okunur. Dikkat: <b>My phone is dead</b> "telefonumun şarjı bitti" demektir, telefon bozuldu değil!`,
`phone=telefon|computer=bilgisayar|laptop=dizüstü bilgisayar|internet=internet|app=uygulama|password=şifre|email=e-posta|screen=ekran|battery=pil, batarya|charger=şarj aleti|download=indirmek|click=tıklamak`,
`My phone is dead.=Telefonumun şarjı bitti.|What's the Wi-Fi password?=Wi-Fi şifresi ne?|Download the app.=Uygulamayı indir.|Can I charge my phone here?=Telefonumu burada şarj edebilir miyim?|Click here.=Buraya tıkla.|Send me an email.=Bana e-posta gönder.`,
`A:Oh no, my phone is dead.=Eyvah, telefonumun şarjı bitti.|B:Do you need a charger?=Şarj aleti lazım mı?|A:Yes, please! And what's the Wi-Fi password?=Evet lütfen! Bir de Wi-Fi şifresi ne?|B:It's on the table. Just scan the code.=Masanın üstünde. Kodu okutman yeter.|A:Great, thanks!=Harika, teşekkürler!`],
["A1","Mağazada","🛍️",`Mağazada <b>I'm just looking</b> (Sadece bakıyorum) çok işe yarar. <b>this / these</b> yakındaki, <b>that / those</b> uzaktaki şeyler için. Beden: <i>small, medium, large</i>. Ödeme: <i>pay by card</i> (kartla), <i>pay in cash</i> (nakit).`,
`buy=satın almak|sell=satmak|shop=mağaza|price=fiyat|size=beden, boyut|color=renk|big=büyük|small=küçük|cash=nakit|card=kart|pay=ödemek|open=açık`,
`I'm just looking, thanks.=Sadece bakıyorum, teşekkürler.|I want to buy this.=Bunu almak istiyorum.|Do you have a bigger size?=Daha büyük bedeniniz var mı?|Can I pay by card?=Kartla ödeyebilir miyim?|Can I try it on?=Deneyebilir miyim?`,
`A:Can I help you?=Yardımcı olabilir miyim?|B:Yes, do you have this shirt in blue?=Evet, bu gömleğin mavisi var mı?|A:Yes. What size?=Evet. Hangi beden?|B:Medium, please. Can I try it on?=Medium lütfen. Deneyebilir miyim?|A:Of course. The fitting room is over there.=Tabii. Deneme kabini şurada.`],
["A1","Hobiler","🎮",`Sevdiğin şeyleri anlatırken <b>like / love / hate + fiil-ing</b>: <i>I like reading.</i> Soru: <i>Do you like ...?</i> <b>What do you do in your free time?</b> (Boş zamanında ne yaparsın?) sohbet başlatmak için harika bir sorudur.`,
`like=sevmek|love=çok sevmek|hate=nefret etmek|music=müzik|movie=film|football=futbol|read=okumak|book=kitap|game=oyun|travel=seyahat etmek|swim=yüzmek|favorite=en sevilen`,
`What do you do in your free time?=Boş zamanında ne yaparsın?|I like reading books.=Kitap okumayı severim.|What's your favorite movie?=En sevdiğin film ne?|I love travelling.=Seyahat etmeye bayılırım.|I don't like football.=Futbolu sevmem.`,
`A:What do you do in your free time?=Boş zamanında ne yaparsın?|B:I love playing video games. And you?=Video oyunları oynamayı çok severim. Ya sen?|A:I like reading and swimming.=Okumayı ve yüzmeyi severim.|B:Cool! What's your favorite book?=Güzel! En sevdiğin kitap ne?|A:Hard question! Maybe The Alchemist.=Zor soru! Belki Simyacı.`],
["A1","İş ve can","💼",`<b>can</b> = -ebilmek, tüm şahıslarda aynıdır: <i>I can, she can</i>. Olumsuz: <b>can't</b>. Soru: <i>Can you ...?</i> İş anlatırken: <i>I work <b>as</b> a designer</i> (tasarımcı olarak), <i>I work <b>for</b> a startup</i> (bir girişimde).`,
`can=-ebilmek|job=iş|office=ofis|meeting=toplantı|busy=meşgul|free=boş, ücretsiz|help=yardım etmek|speak=konuşmak|team=ekip|boss=patron|colleague=iş arkadaşı|work from home=evden çalışmak`,
`I can speak a little English.=Biraz İngilizce konuşabilirim.|Can you help me?=Bana yardım edebilir misin?|I work from home.=Evden çalışıyorum.|I'm busy right now.=Şu an meşgulüm.|I have a meeting at ten.=Saat onda toplantım var.|What do you do?=Ne iş yapıyorsun?`,
`A:What do you do?=Ne iş yapıyorsun?|B:I'm a web designer. I work from home.=Web tasarımcıyım. Evden çalışıyorum.|A:Nice! Can you speak English at work?=Güzel! İşte İngilizce konuşabiliyor musun?|B:A little. My boss is from Canada.=Biraz. Patronum Kanadalı.|A:That's great practice!=Bu harika bir pratik!`],

["A2","Şu an ne yapıyorsun?","🎧",`Şimdiki zaman: <b>am/is/are + fiil-ing</b>. Şu an olan işler için: <i>I'm working.</i> Geçici durumlar için de kullanılır: <i>I'm working on a new project this month.</i> Soru: <b>What are you doing?</b>`,
`doing=yapıyor|working=çalışıyor|watching=izliyor|cooking=yemek yapıyor|waiting=bekliyor|listening=dinliyor|studying=ders çalışıyor|right now=şu anda|at the moment=şu an|project=proje|call=arama, aramak|message=mesaj`,
`What are you doing?=Ne yapıyorsun?|I'm working on a project.=Bir proje üzerinde çalışıyorum.|I'm waiting for the bus.=Otobüsü bekliyorum.|She's talking on the phone.=Telefonda konuşuyor.|Are you listening to me?=Beni dinliyor musun?`,
`A:Hey, what are you doing?=Selam, ne yapıyorsun?|B:I'm cooking dinner. Why?=Akşam yemeği yapıyorum. Neden?|A:I'm watching a match. Do you want to come?=Maç izliyorum. Gelmek ister misin?|B:Sorry, I'm also studying for an exam.=Kusura bakma, bir de sınava çalışıyorum.|A:No problem. Good luck!=Sorun değil. Bol şans!`],
["A2","Dün ne yaptın?","🕰️",`Geçmiş zaman: düzenli fiillere <b>-ed</b> eklenir (work → worked). Düzensizleri ezberle: <i>go → went, see → saw, buy → bought, have → had, do → did, be → was/were</i>. Soru ve olumsuzda <b>did</b> gelir, fiil yalın kalır: <i>Did you go? I didn't go.</i>`,
`yesterday=dün|last week=geçen hafta|ago=önce|went=gitti|saw=gördü|bought=satın aldı|had=sahipti, yedi|did=yaptı|was=idi (tekil)|were=idi (çoğul)|visited=ziyaret etti|stayed=kaldı`,
`What did you do yesterday?=Dün ne yaptın?|I went to the cinema.=Sinemaya gittim.|I bought a new laptop last week.=Geçen hafta yeni bir laptop aldım.|It was great!=Harikaydı!|I didn't see him.=Onu görmedim.`,
`A:How was your weekend?=Hafta sonun nasıldı?|B:It was great! I went to Bodrum.=Harikaydı! Bodrum'a gittim.|A:Wow! What did you do there?=Vay! Orada ne yaptın?|B:I swam, ate fish and stayed in a nice hotel.=Yüzdüm, balık yedim ve güzel bir otelde kaldım.|A:Lucky you! I just stayed at home.=Şanslısın! Ben evde kaldım.`],
["A2","Planlar","🗓️",`<b>going to</b> önceden yapılmış planlar için: <i>I'm going to visit my parents.</i> <b>will</b> anlık karar, tahmin ve söz için: <i>I'll call you.</i> Kesin değilsen <b>maybe / probably</b> ekle: <i>I'll probably stay home.</i>`,
`plan=plan|going to=-ecek (plan)|will=-ecek|next week=gelecek hafta|tonight=bu gece|this weekend=bu hafta sonu|maybe=belki|probably=muhtemelen|holiday=tatil|visit=ziyaret etmek|soon=yakında|later=sonra`,
`What are you going to do this weekend?=Bu hafta sonu ne yapacaksın?|I'm going to visit my parents.=Ailemi ziyaret edeceğim.|Maybe I'll stay at home.=Belki evde kalırım.|I'll call you tonight.=Bu akşam seni ararım.|It's going to rain.=Yağmur yağacak.`,
`A:Any plans for the weekend?=Hafta sonu için plan var mı?|B:Yes, I'm going to start a new online course.=Evet, yeni bir online kursa başlayacağım.|A:Oh, what about?=Aa, ne hakkında?|B:Digital marketing. What about you?=Dijital pazarlama. Ya sen?|A:I don't know. Maybe I'll just relax.=Bilmiyorum. Belki sadece dinlenirim.`],
["A2","Online alışveriş","🛒",`Temel kelimeler: <b>cart</b> (sepet), <b>checkout</b> (ödeme adımı), <b>shipping</b> (kargo), <b>delivery</b> (teslimat), <b>refund</b> (para iadesi). <b>order</b> hem "sipariş" (isim) hem "sipariş vermek" (fiil) olarak kullanılır.`,
`online=çevrimiçi|order=sipariş, sipariş vermek|cart=sepet|checkout=ödeme adımı|delivery=teslimat|shipping=kargo, gönderim|return=iade etmek|refund=para iadesi|discount=indirim|track=takip etmek|package=paket|item=ürün, parça`,
`I ordered it online.=Onu internetten sipariş ettim.|Add to cart.=Sepete ekle.|When will my package arrive?=Paketim ne zaman gelir?|I want to return this item.=Bu ürünü iade etmek istiyorum.|Is shipping free?=Kargo ücretsiz mi?|Can I track my order?=Siparişimi takip edebilir miyim?`,
`A:I bought new headphones online.=İnternetten yeni kulaklık aldım.|B:Nice! When will they arrive?=Güzel! Ne zaman gelecek?|A:Tomorrow. Shipping was free.=Yarın. Kargo ücretsizdi.|B:Did you get a discount?=İndirim aldın mı?|A:Yes, twenty percent with a coupon!=Evet, kuponla yüzde yirmi!|B:Great deal!=Süper fırsat!`],
["A2","Karşılaştırma","⚖️",`Kısa sıfatlara <b>-er</b> (cheap → cheaper), uzun sıfatlara <b>more</b> (more expensive) eklenir, ardından <b>than</b> gelir. En üstünlük: <b>the -est</b> / <b>the most</b>. Düzensizler: <i>good → better → the best, bad → worse → the worst</i>.`,
`better=daha iyi|worse=daha kötü|faster=daha hızlı|cheaper=daha ucuz|more expensive=daha pahalı|bigger=daha büyük|easier=daha kolay|than=-den daha|the best=en iyi|the cheapest=en ucuz|the most popular=en popüler|similar=benzer`,
`This phone is cheaper than that one.=Bu telefon ondan daha ucuz.|It's the best app.=En iyi uygulama bu.|Online shopping is easier.=Online alışveriş daha kolay.|Which one is better?=Hangisi daha iyi?|It's more expensive than I thought.=Düşündüğümden daha pahalı.`,
`A:Which laptop should I buy?=Hangi laptopu almalıyım?|B:This one is cheaper, but that one is faster.=Bu daha ucuz ama şu daha hızlı.|A:Which one is better for design?=Tasarım için hangisi daha iyi?|B:The faster one. It has a bigger screen too.=Hızlı olan. Ekranı da daha büyük.|A:OK, but it's more expensive than I thought!=Tamam ama düşündüğümden pahalı!`],
["A2","Sosyal medya","📸",`Sosyal medya fiilleri: <b>post</b> (paylaşmak, gönderi), <b>follow</b> (takip etmek), <b>like</b> (beğenmek), <b>comment</b> (yorum yapmak). <b>go viral</b> = viral olmak. <b>DM me</b> = bana özelden yaz.`,
`post=gönderi, paylaşmak|share=paylaşmak|like=beğenmek|comment=yorum|follow=takip etmek|followers=takipçiler|story=hikaye (story)|account=hesap|profile=profil|content=içerik|viral=viral|influencer=fenomen`,
`Follow me on Instagram.=Beni Instagram'da takip et.|I posted a new story.=Yeni bir story paylaştım.|Send me a DM.=Bana DM at.|That video went viral.=O video viral oldu.|How many followers do you have?=Kaç takipçin var?`,
`A:Did you see my new post?=Yeni gönderimi gördün mü?|B:Yes! I liked it. Great photo!=Evet! Beğendim. Harika fotoğraf!|A:Thanks! It has a thousand likes already.=Teşekkürler! Şimdiden bin beğeni aldı.|B:Wow, it's going viral!=Vay, viral oluyor!|A:Maybe! Share it in your story, please.=Belki! Story'nde paylaş lütfen.`],
["A2","Seyahat","✈️",`Rezervasyon için <b>book</b> (ayırtmak): <i>I'd like to book a room.</i> Havalimanında: <b>check in</b>, <b>boarding pass</b> (biniş kartı), <b>gate</b> (kapı), <b>delayed</b> (rötarlı). Otelde: <i>I have a reservation under the name ...</i>`,
`airport=havalimanı|flight=uçuş|ticket=bilet|passport=pasaport|hotel=otel|room=oda|booking=rezervasyon|luggage=bagaj|check in=giriş yapmak|trip=gezi|abroad=yurt dışı|delayed=rötarlı`,
`I'd like to book a room.=Bir oda ayırtmak istiyorum.|My flight is delayed.=Uçuşum rötarlı.|Where can I check in?=Nerede check-in yapabilirim?|I have a reservation.=Rezervasyonum var.|How long is the flight?=Uçuş ne kadar sürüyor?`,
`A:Good evening. I have a reservation.=İyi akşamlar. Rezervasyonum var.|B:What's your name, please?=Adınız lütfen?|A:Mert Kaya. For three nights.=Mert Kaya. Üç gece için.|B:Here's your key. Room 305.=Anahtarınız. Oda 305.|A:Thanks. What time is breakfast?=Teşekkürler. Kahvaltı saat kaçta?|B:From seven to ten.=Yediden ona kadar.`],
["A2","Duygular ve sağlık","💬",`Duygular için <b>I feel ...</b> veya <b>I'm ...</b>: <i>I feel tired, I'm stressed.</i> Ağrılar: <b>I have a headache / stomachache</b>. Tavsiye vermek: <b>You should ...</b> (...malısın).`,
`feel=hissetmek|tired=yorgun|sick=hasta|headache=baş ağrısı|doctor=doktor|medicine=ilaç|stressed=stresli|happy=mutlu|sad=üzgün|excited=heyecanlı|bored=sıkılmış|rest=dinlenmek`,
`I feel tired.=Yorgun hissediyorum.|I have a headache.=Başım ağrıyor.|You should rest.=Dinlenmelisin.|What's wrong?=Ne oldu?|I'm so excited!=Çok heyecanlıyım!|I hope you feel better.=Umarım daha iyi hissedersin.`,
`A:You look tired. What's wrong?=Yorgun görünüyorsun. Ne oldu?|B:I have a headache. I worked all night.=Başım ağrıyor. Bütün gece çalıştım.|A:You should rest a little.=Biraz dinlenmelisin.|B:I know, but I have a deadline.=Biliyorum ama teslim tarihim var.|A:Take a break. I hope you feel better.=Mola ver. Umarım daha iyi hissedersin.`],
["A2","Tavsiye ve zorunluluk","☝️",`<b>should</b> = tavsiye (yumuşak). <b>have to</b> = dış zorunluluk (kural, iş). <b>must</b> = güçlü zorunluluk. Dikkat: <b>don't have to</b> = gerek yok, ama <b>mustn't</b> = yasak!`,
`should=-meli (tavsiye)|must=-meli (zorunlu)|have to=zorunda olmak|don't have to=gerekmiyor|need to=gerekmek|advice=tavsiye|rule=kural|deadline=son teslim tarihi|important=önemli|try=denemek|mustn't=yasak, yapmamalı|allowed=izinli`,
`You should try it.=Denemelisin.|I have to finish this today.=Bunu bugün bitirmem lazım.|You don't have to pay.=Ödemek zorunda değilsin.|The deadline is Friday.=Son tarih cuma.|You mustn't share your password.=Şifreni paylaşmamalısın.`,
`A:I want to learn English faster. Any advice?=İngilizceyi daha hızlı öğrenmek istiyorum. Tavsiyen var mı?|B:You should practice every day.=Her gün pratik yapmalısın.|A:Do I have to take a course?=Kursa gitmek zorunda mıyım?|B:No, you don't have to. Apps and podcasts are fine.=Hayır, gerekmiyor. Uygulamalar ve podcastler yeterli.|A:Good idea. I'll try.=İyi fikir. Deneyeceğim.`],
["A2","Teknik sorunlar","🛠️",`<b>keep + -ing</b> = sürekli olmak: <i>It keeps crashing</i> (Sürekli çöküyor). <b>Did you try ...ing?</b> = ...meyi denedin mi? Sık fiiller: <i>log in / log out</i> (giriş / çıkış yapmak), <i>restart</i>, <i>update</i>, <i>reset</i>.`,
`update=güncellemek|install=yüklemek, kurmak|crash=çökmek|bug=hata (yazılım)|slow=yavaş|restart=yeniden başlatmak|log in=giriş yapmak|log out=çıkış yapmak|settings=ayarlar|error=hata mesajı|fix=düzeltmek|reset=sıfırlamak`,
`The app keeps crashing.=Uygulama sürekli çöküyor.|Did you try restarting it?=Yeniden başlatmayı denedin mi?|I can't log in.=Giriş yapamıyorum.|There's a bug.=Bir hata var.|I forgot my password.=Şifremi unuttum.|Let me fix it.=Düzelteyim.`,
`A:My app keeps crashing!=Uygulamam sürekli çöküyor!|B:Did you try restarting your phone?=Telefonunu yeniden başlatmayı denedin mi?|A:Yes, twice. It's still very slow.=Evet, iki kere. Hâlâ çok yavaş.|B:Maybe you need to update it. Check the settings.=Belki güncellemen gerek. Ayarlara bak.|A:Oh, there's a new version. Thanks!=Aa, yeni sürüm var. Teşekkürler!`],
["A2","Randevu ve davet","🤝",`Öneri kalıpları: <b>How about ...?</b> / <b>What about ...?</b> (...'e ne dersin?), <b>Let's ...</b> (Hadi ...). Müsaitlik: <i>Are you available on ...?</i> Erteleme: <b>postpone</b>; iptal: <b>cancel</b>; uygun olduğunu söylemek: <b>That works for me.</b>`,
`invite=davet etmek|available=müsait|schedule=program, planlamak|appointment=randevu|cancel=iptal etmek|postpone=ertelemek|confirm=onaylamak|how about=... ne dersin|let's=hadi ...|calendar=takvim|time slot=zaman aralığı|reschedule=yeniden planlamak`,
`Are you available on Tuesday?=Salı müsait misin?|How about 3 pm?=Öğleden sonra 3'e ne dersin?|Let's meet tomorrow.=Yarın buluşalım.|I need to cancel our meeting.=Toplantımızı iptal etmem gerekiyor.|Can we reschedule?=Başka bir zamana alabilir miyiz?|That works for me.=Bana uyar.`,
`A:Are you available for a quick call this week?=Bu hafta kısa bir görüşme için müsait misin?|B:Sure. How about Thursday?=Tabii. Perşembeye ne dersin?|A:Thursday is busy. What about Friday morning?=Perşembe dolu. Cuma sabahı olur mu?|B:Friday at ten works for me.=Cuma saat on bana uyar.|A:Perfect. I'll send you an invite.=Mükemmel. Sana davet göndereceğim.`],
["A2","Müşteri hizmetleri","🎧",`Müşteri hizmetlerinde kibar dil çok önemli: <b>How can I help you?</b>, <b>Could you ...?</b>, <b>I'm sorry to hear that</b> (Bunu duyduğuma üzüldüm). Şikayet ederken: <i>My order arrived damaged. / I received the wrong item.</i>`,
`customer=müşteri|service=hizmet|complaint=şikayet|problem=sorun|order number=sipariş numarası|wrong=yanlış|damaged=hasarlı|replace=değiştirmek|replacement=yenisi, değişim|contact=iletişime geçmek|support=destek|inconvenience=rahatsızlık`,
`How can I help you?=Size nasıl yardımcı olabilirim?|My order arrived damaged.=Siparişim hasarlı geldi.|Could you give me your order number?=Sipariş numaranızı verebilir misiniz?|We'll send a replacement.=Yenisini göndereceğiz.|Sorry for the inconvenience.=Rahatsızlık için özür dileriz.|I'm sorry to hear that.=Bunu duyduğuma üzüldüm.`,
`A:Hello, customer support. How can I help you?=Merhaba, müşteri desteği. Nasıl yardımcı olabilirim?|B:Hi. I received the wrong item.=Merhaba. Bana yanlış ürün geldi.|A:I'm sorry to hear that. Could you give me your order number?=Duyduğuma üzüldüm. Sipariş numaranızı verir misiniz?|B:Sure, it's 48210.=Tabii, 48210.|A:Thank you. We'll send a replacement today.=Teşekkürler. Bugün doğrusunu göndereceğiz.|B:Great, thanks for your help.=Harika, yardımınız için teşekkürler.`],

["B1","Hiç denedin mi?","🌍",`<b>have/has + V3</b> (Present Perfect): deneyimler ve şimdiyle bağlantılı durumlar. <i>Have you <b>ever</b> ...?</i> = Hiç ...dın mı? Süre: <b>for</b> two years; başlangıç: <b>since</b> 2020. "yesterday" gibi belirli geçmiş zamanla kullanılmaz!`,
`ever=hiç (soruda)|never=hiç, asla|already=zaten, çoktan|yet=henüz|just=az önce|since=-den beri|for=süresince|been=bulunmuş, gitmiş|done=yapılmış|tried=denemiş|experience=deneyim|so far=şimdiye kadar`,
`Have you ever tried sushi?=Hiç suşi denedin mi?|I've never been to London.=Hiç Londra'ya gitmedim.|I've just finished.=Az önce bitirdim.|I've worked here for two years.=İki yıldır burada çalışıyorum.|Have you sent the email yet?=E-postayı gönderdin mi?|So far, so good.=Şimdiye kadar her şey yolunda.`,
`A:Have you ever worked for a startup?=Hiç bir girişimde çalıştın mı?|B:Yes, I've worked at two startups since 2020.=Evet, 2020'den beri iki girişimde çalıştım.|A:How was it?=Nasıldı?|B:Hard but exciting. I've learned a lot.=Zor ama heyecanlı. Çok şey öğrendim.|A:I've never tried. Maybe I should.=Ben hiç denemedim. Belki denemeliyim.`],
["B1","Fikrini söyle","🗣️",`Fikir bildirmek: <b>I think / I believe / In my opinion</b>. Katılmak: <i>I agree, Exactly, That's true</i>. Kibarca katılmamak: <b>I see your point, but ...</b> Direkt <i>You're wrong</i> demek kaba kaçar.`,
`opinion=görüş|I think=düşünüyorum|believe=inanmak|agree=katılmak|disagree=katılmamak|in my opinion=bana göre|point=nokta, fikir|actually=aslında|honestly=açıkçası|it depends=duruma göre değişir|idea=fikir|true=doğru`,
`In my opinion, it's a good idea.=Bence iyi bir fikir.|I totally agree.=Kesinlikle katılıyorum.|I see your point, but...=Ne demek istediğini anlıyorum ama...|I'm not sure about that.=Bundan emin değilim.|It depends.=Duruma göre değişir.|That's a good point.=Haklı bir nokta.`,
`A:I think remote work is better than office work.=Bence uzaktan çalışma ofisten daha iyi.|B:I see your point, but I miss my team.=Ne demek istediğini anlıyorum ama ekibimi özlüyorum.|A:That's true. Maybe a hybrid model?=Doğru. Belki hibrit model?|B:Honestly, I agree. Two days in the office is perfect.=Açıkçası katılıyorum. Ofiste iki gün mükemmel.|A:It depends on the job, of course.=Tabii işe göre değişir.`],
["B1","Girişimcilik 101","🚀",`Girişimcilik İngilizcesi: <b>start a business</b> (iş kurmak), <b>launch</b> (piyasaya sürmek), <b>target customer</b> (hedef müşteri), <b>grow</b> (büyümek). Kuran kişiye <b>founder</b>, erken aşamadaki işe <i>early-stage startup</i> denir.`,
`startup=girişim|founder=kurucu|idea=fikir|business=iş, işletme|customer=müşteri|product=ürün|market=pazar|launch=piyasaya sürmek|grow=büyümek|risk=risk|investor=yatırımcı|profit=kâr`,
`I want to start my own business.=Kendi işimi kurmak istiyorum.|We launched our product last month.=Ürünümüzü geçen ay piyasaya sürdük.|Who is your target customer?=Hedef müşterin kim?|It's a big risk.=Büyük bir risk.|What's your idea?=Fikrin ne?|We're growing every month.=Her ay büyüyoruz.`,
`A:I want to start my own business.=Kendi işimi kurmak istiyorum.|B:Cool! What's your idea?=Harika! Fikrin ne?|A:An app for local farmers to sell online.=Yerel çiftçilerin online satış yapması için bir uygulama.|B:Interesting. Who is your target customer?=İlginç. Hedef müşterin kim?|A:People in cities who want fresh food.=Taze gıda isteyen şehirdeki insanlar.|B:Sounds good. Start small and test it.=Kulağa iyi geliyor. Küçük başla ve test et.`],
["B1","Online mağaza kurmak","🏪",`Mağaza sahibi olarak: <b>run a store</b> (mağaza işletmek), <b>in stock / out of stock</b> (stokta var / yok), <b>supplier</b> (tedarikçi), <b>ship worldwide</b> (dünyaya gönderim). Satışlar arttı: <i>sales went up</i>; düştü: <i>went down</i>.`,
`store=mağaza|website=web sitesi|product page=ürün sayfası|payment=ödeme|inventory=envanter|stock=stok|supplier=tedarikçi|brand=marka|domain=alan adı|platform=platform|sales=satışlar|margin=kâr marjı`,
`I run an online store.=Online bir mağaza işletiyorum.|We're out of stock.=Stokta kalmadı.|Our sales went up.=Satışlarımız arttı.|Which platform do you use?=Hangi platformu kullanıyorsun?|We ship worldwide.=Dünya çapında gönderim yapıyoruz.|I need a reliable supplier.=Güvenilir bir tedarikçiye ihtiyacım var.`,
`A:What do you sell in your store?=Mağazanda ne satıyorsun?|B:Handmade ceramics. We ship worldwide.=El yapımı seramik. Dünyaya gönderim yapıyoruz.|A:Which platform do you use?=Hangi platformu kullanıyorsun?|B:Shopify. It's easy to set up.=Shopify. Kurulumu kolay.|A:How are sales?=Satışlar nasıl?|B:They went up by thirty percent this year.=Bu yıl yüzde otuz arttı.`],
["B1","Olsaydı ne yapardın?","🎲",`<b>1. tip (gerçek olasılık)</b>: If + geniş zaman, will: <i>If it rains, I'll stay home.</i> <b>2. tip (hayali)</b>: If + geçmiş, would: <i>If I had money, I would travel.</i> Kalıp: <b>If I were you</b> (Senin yerinde olsam). <b>unless</b> = -mezse.`,
`if=eğer|unless=-mezse|would=-erdi|could=-ebilirdi|happen=olmak, meydana gelmek|choose=seçmek|win=kazanmak|rich=zengin|decide=karar vermek|if I were you=senin yerinde olsam|lottery=piyango|imagine=hayal etmek`,
`If it rains, I'll stay home.=Yağmur yağarsa evde kalırım.|If I had money, I would travel.=Param olsaydı seyahat ederdim.|What would you do?=Sen ne yapardın?|If I were you, I'd accept the offer.=Senin yerinde olsam teklifi kabul ederdim.|Unless you try, you'll never know.=Denemezsen asla bilemezsin.`,
`A:What would you do if you won the lottery?=Piyangoyu kazansan ne yapardın?|B:I would start my own company. And you?=Kendi şirketimi kurardım. Ya sen?|A:I'd travel around the world first.=Önce dünyayı gezerdim.|B:If you travel, you'll get great ideas.=Seyahat edersen harika fikirler bulursun.|A:Exactly! If I were rich, I'd do both.=Aynen! Zengin olsam ikisini de yapardım.`],
["B1","İş toplantısı","📊",`Toplantı yönetmek: açılış <b>Let's get started</b>, son durumu sormak <b>Can you give us an update?</b>, söz almak <b>Can I add something?</b>, kapanış <b>Let's wrap up</b>. <b>Action items</b> = toplantıdan çıkan yapılacak işler.`,
`agenda=gündem|update=güncelleme, son durum|goal=hedef|task=görev|progress=ilerleme|feedback=geri bildirim|priority=öncelik|next step=sonraki adım|summary=özet|discuss=tartışmak|wrap up=toparlamak|action item=yapılacak iş`,
`Let's get started.=Hadi başlayalım.|Can you give us an update?=Bize son durumu anlatır mısın?|What are the next steps?=Sonraki adımlar neler?|Can I add something?=Bir şey ekleyebilir miyim?|Let's discuss this later.=Bunu sonra konuşalım.|Let's wrap up.=Toparlayalım.`,
`A:OK everyone, let's get started. Sara, can you give us an update?=Pekâlâ, başlayalım. Sara, bize son durumu anlatır mısın?|B:Sure. The new website is almost ready.=Tabii. Yeni web sitesi neredeyse hazır.|A:Great progress. Any problems?=Harika ilerleme. Sorun var mı?|B:Just one. We need more product photos.=Sadece bir tane. Daha fazla ürün fotoğrafı lazım.|A:OK, that's our priority. What are the next steps?=Tamam, önceliğimiz bu. Sonraki adımlar neler?|B:I'll send a summary after the meeting.=Toplantıdan sonra bir özet göndereceğim.`],
["B1","E-posta yazmak","✉️",`Resmi e-posta <b>Dear Mr./Ms. ...</b> ile başlar, <b>Best regards</b> ya da <b>Kind regards</b> ile biter. Yarı resmi: <i>Hi Ali, ... Best,</i> Kalıplar: <i>I'm writing to ...</i> (...amacıyla yazıyorum), <i>Please find attached ...</i> (... ektedir).`,
`dear=sayın, sevgili|regards=saygılar|attach=eklemek|attachment=ek dosya|reply=cevap vermek|forward=iletmek|subject=konu|follow up=takip etmek|as soon as possible=en kısa sürede|look forward to=dört gözle beklemek|reach out=ulaşmak|inbox=gelen kutusu`,
`I hope you're doing well.=Umarım iyisinizdir.|I'm writing to ask about your prices.=Fiyatlarınızı sormak için yazıyorum.|Please find the file attached.=Dosya ektedir.|I'm looking forward to your reply.=Cevabınızı dört gözle bekliyorum.|Just following up on my last email.=Son e-postamla ilgili dönüş yapıyorum.|Best regards,=Saygılarımla,`,
`A:Did you reply to the supplier?=Tedarikçiye cevap verdin mi?|B:Not yet. How should I start?=Henüz değil. Nasıl başlamalıyım?|A:Start with: I hope you're doing well.=Şöyle başla: Umarım iyisinizdir.|B:OK. Then: Please find the order attached?=Tamam. Sonra: Sipariş ektedir, mi?|A:Perfect. And end with Best regards.=Mükemmel. Saygılarımla diye bitir.|B:Great, I'll send it as soon as possible.=Harika, en kısa sürede gönderirim.`],
["B1","Pazarlama","📣",`Pazarlama terimleri: <b>target audience</b> (hedef kitle), <b>reach</b> (ulaşmak, erişim), <b>conversion</b> (dönüşüm), <b>campaign</b> (kampanya), <b>engagement</b> (etkileşim). <b>run ads</b> = reklam vermek.`,
`marketing=pazarlama|campaign=kampanya|ad=reklam|audience=kitle|target=hedef|reach=ulaşmak|brand awareness=marka bilinirliği|conversion=dönüşüm|promote=tanıtmak|strategy=strateji|budget=bütçe|engagement=etkileşim`,
`Our target audience is young people.=Hedef kitlemiz gençler.|We need a bigger budget for ads.=Reklamlar için daha büyük bütçe lazım.|The campaign was successful.=Kampanya başarılı oldu.|How do we reach more customers?=Daha fazla müşteriye nasıl ulaşırız?|Let's run ads on Instagram.=Instagram'da reklam verelim.`,
`A:How do we reach more customers?=Daha fazla müşteriye nasıl ulaşırız?|B:Let's run ads on Instagram and TikTok.=Instagram ve TikTok'ta reklam verelim.|A:Good idea. Who is our target audience?=İyi fikir. Hedef kitlemiz kim?|B:Mostly women between 25 and 40.=Çoğunlukla 25-40 yaş arası kadınlar.|A:And the budget?=Peki bütçe?|B:Let's start small and check the conversion rate.=Küçük başlayıp dönüşüm oranına bakalım.`],
["B1","Edilgen yapı","📦",`Edilgen yapı: <b>be + V3</b>. İşi kimin yaptığı önemli değilse kullanılır: <i>The order <b>was shipped</b></i> (Sipariş kargolandı). Şimdi: <i>is made</i>, geçmiş: <i>was made</i>, present perfect: <i>has been made</i>. E-ticaret mesajlarında çok sık görürsün!`,
`made=yapılmış|built=inşa edilmiş|sent=gönderilmiş|delivered=teslim edilmiş|designed=tasarlanmış|used=kullanılmış|sold=satılmış|produced=üretilmiş|created=oluşturulmuş|tested=test edilmiş|shipped=kargolanmış|processed=işlenmiş`,
`This app was built in Turkey.=Bu uygulama Türkiye'de yapıldı.|Your order has been shipped.=Siparişiniz kargoya verildi.|Payments are processed securely.=Ödemeler güvenli şekilde işlenir.|The product is made by hand.=Ürün el yapımıdır.|It was designed for small businesses.=Küçük işletmeler için tasarlandı.`,
`A:Where are these bags made?=Bu çantalar nerede yapılıyor?|B:They're made by hand in Gaziantep.=Gaziantep'te el yapımı olarak üretiliyor.|A:Nice! Are they sold in stores?=Güzel! Mağazalarda satılıyor mu?|B:No, they're only sold online.=Hayır, sadece online satılıyor.|A:And how are they delivered?=Peki nasıl teslim ediliyor?|B:Every order is shipped within two days.=Her sipariş iki gün içinde kargolanıyor.`],
["B1","Teknoloji trendleri","🤖",`Teknoloji sohbetinde: <b>AI</b> (yapay zeka, "ey-ay" okunur), <b>cloud</b> (bulut), <b>automation</b> (otomasyon). <b>save time</b> = zaman kazandırmak, <b>replace</b> = yerini almak. Tahmin: <i>I think AI will ...</i>`,
`AI=yapay zeka|data=veri|cloud=bulut|automation=otomasyon|software=yazılım|developer=yazılımcı|tool=araç|secure=güvenli|privacy=gizlilik|innovation=yenilik|future=gelecek|replace=yerini almak`,
`AI is changing everything.=Yapay zeka her şeyi değiştiriyor.|We store our data in the cloud.=Verilerimizi bulutta saklıyoruz.|Is it secure?=Güvenli mi?|This tool saves me a lot of time.=Bu araç bana çok zaman kazandırıyor.|Will AI replace our jobs?=Yapay zeka işlerimizin yerini alacak mı?`,
`A:Do you use AI tools at work?=İşte yapay zeka araçları kullanıyor musun?|B:Every day. They save me a lot of time.=Her gün. Bana çok zaman kazandırıyor.|A:Aren't you worried about privacy?=Gizlilik konusunda endişelenmiyor musun?|B:A little. I never share customer data.=Biraz. Müşteri verisini asla paylaşmam.|A:Smart. Will AI replace developers?=Akıllıca. Yapay zeka yazılımcıların yerini alır mı?|B:I think it will change their jobs, not replace them.=Bence işlerini değiştirecek, yerlerini almayacak.`],
["B1","Hikaye anlatmak","📖",`Hikayede arka plan için <b>was/were + -ing</b>, araya giren olay için geçmiş zaman: <i>I was working when he called.</i> Bağlayıcılar: <b>at first</b> (ilk başta), <b>then</b> (sonra), <b>suddenly</b> (aniden), <b>in the end</b> (sonunda).`,
`while=... iken|when=-dığında|suddenly=aniden|then=sonra|after that=ondan sonra|finally=nihayet|at first=ilk başta|in the end=en sonunda|happened=oldu|was doing=yapıyordu|meanwhile=bu arada|luckily=neyse ki`,
`I was working when he called.=O aradığında çalışıyordum.|Suddenly, the power went out.=Birden elektrik kesildi.|At first, it was difficult.=İlk başta zordu.|In the end, everything was fine.=Sonunda her şey yolundaydı.|What happened next?=Sonra ne oldu?`,
`A:How did you start your business?=İşine nasıl başladın?|B:I was working at a bank when I got the idea.=Bir bankada çalışırken aklıma fikir geldi.|A:What happened next?=Sonra ne oldu?|B:At first, I sold products to friends. Then sales grew.=İlk başta arkadaşlara sattım. Sonra satışlar büyüdü.|A:And in the end?=Ve sonunda?|B:Luckily, I quit my job and never looked back.=Neyse ki işimi bıraktım ve hiç arkama bakmadım.`],
["B1","Kibar rica","🙏",`Kibarlık sırası: <i>Can you ...?</i> → <b>Could you ...?</b> → <b>Would you mind ...ing?</b> Dikkat: <i>Would you mind</i> sorusuna olumlu cevap <b>No, not at all</b> olur (Hayır, hiç sakıncası yok). İzin istemek: <i>Is it OK if I ...?</i>`,
`could=-ebilir misiniz (kibar)|would you mind=sakıncası var mı|possible=mümkün|favor=iyilik|offer=teklif etmek|of course=tabii ki|sure=tabii|request=rica, talep|permission=izin|appreciate=minnettar olmak|kindly=lütfen (resmi)|not at all=hiç de değil`,
`Could you send me the details?=Detayları bana gönderebilir misiniz?|Would you mind waiting a moment?=Biraz beklemenizde sakınca var mı?|Is it possible to change the date?=Tarihi değiştirmek mümkün mü?|Can I ask you a favor?=Senden bir iyilik isteyebilir miyim?|Sure, no problem.=Tabii, sorun değil.|I'd really appreciate it.=Çok minnettar olurum.`,
`A:Can I ask you a favor?=Senden bir iyilik isteyebilir miyim?|B:Sure. What is it?=Tabii. Nedir?|A:Would you mind checking my presentation?=Sunumuma göz atmanın sakıncası var mı?|B:Not at all. When do you need it?=Hiç değil. Ne zaman lazım?|A:Is it possible by tomorrow? I'd really appreciate it.=Yarına kadar mümkün mü? Çok minnettar olurum.|B:Of course. Send it to me.=Tabii ki. Bana gönder.`],

["B2","Yatırımcıya pitch","💡",`Pitch dili net ve güçlü olmalı: <b>We help [kime] [ne yapmasına] by [nasıl]</b>. Sayılarla konuş: <i>Our revenue doubled. We have 5,000 active users.</i> <b>raise</b> = yatırım toplamak, <b>traction</b> = pazarda kanıtlanmış ivme.`,
`pitch=yatırım sunumu|investor=yatırımcı|funding=fon, yatırım|raise=toplamak (yatırım)|valuation=değerleme|revenue=gelir|traction=ivme, çekiş|scale=ölçeklemek|competitor=rakip|advantage=avantaj|vision=vizyon|equity=hisse`,
`We're raising a seed round.=Tohum yatırım turu topluyoruz.|Our revenue doubled this year.=Gelirimiz bu yıl ikiye katlandı.|What makes you different from competitors?=Seni rakiplerden farklı kılan ne?|We help small shops sell online.=Küçük dükkanların online satış yapmasına yardım ediyoruz.|We have strong traction.=Güçlü bir ivmemiz var.`,
`A:So, what does your company do?=Peki şirketiniz ne yapıyor?|B:We help small shops sell online in one click.=Küçük dükkanların tek tıkla online satış yapmasına yardım ediyoruz.|A:How much traction do you have?=Ne kadar ivmeniz var?|B:Two thousand paying stores, and revenue doubled this year.=İki bin ödeme yapan mağaza ve gelir bu yıl ikiye katlandı.|A:Impressive. How much are you raising?=Etkileyici. Ne kadar topluyorsunuz?|B:One million dollars to scale in Europe.=Avrupa'da büyümek için bir milyon dolar.`],
["B2","Pazarlık","🤝",`Pazarlıkta yumuşatıcılar kullan: <b>We were hoping for ...</b>, <b>Would you consider ...?</b> Uzlaşma: <b>Let's meet halfway</b>. Kararlı durmak: <i>That's our final offer.</i> Anlaşma: <b>It's a deal!</b>`,
`negotiate=pazarlık etmek|deal=anlaşma, fırsat|offer=teklif|terms=şartlar|contract=sözleşme|agreement=mutabakat|compromise=uzlaşma|fair=adil|bulk order=toplu sipariş|bottom line=net sonuç|sign=imzalamak|consider=değerlendirmek`,
`Can we negotiate the price?=Fiyat üzerinde pazarlık yapabilir miyiz?|That's my final offer.=Bu son teklifim.|If you order in bulk, we can offer a discount.=Toplu sipariş verirseniz indirim yapabiliriz.|Let's meet halfway.=Ortada buluşalım.|Would you consider a longer contract?=Daha uzun bir sözleşmeyi düşünür müsünüz?|It's a deal!=Anlaştık!`,
`A:Your price is a bit high for us.=Fiyatınız bizim için biraz yüksek.|B:If you order in bulk, we can offer ten percent off.=Toplu sipariş verirseniz yüzde on indirim yapabiliriz.|A:We were hoping for twenty.=Yirmi umuyorduk.|B:Twenty is too much. Let's meet halfway: fifteen.=Yirmi çok fazla. Ortada buluşalım: on beş.|A:Fifteen, with free shipping?=On beş, ücretsiz kargoyla?|B:OK, it's a deal!=Tamam, anlaştık!`],
["B2","Veriler ve metrikler","📈",`Değişimi anlatmak: <b>increase / rise / go up</b> (artmak), <b>decrease / drop / go down</b> (azalmak). Miktar farkı <b>by</b> ile (by 20%), ulaşılan değer <b>to</b> ile (to 5,000). <b>churn</b> = müşteri kaybı, <b>retention</b> = elde tutma.`,
`metric=ölçüt|KPI=performans göstergesi|growth rate=büyüme oranı|churn=müşteri kaybı|retention=elde tutma|increase=artmak, artış|decrease=azalmak|percent=yüzde|analyze=analiz etmek|trend=eğilim|dashboard=gösterge paneli|insight=içgörü`,
`Sales increased by 20 percent.=Satışlar yüzde 20 arttı.|Our churn rate is too high.=Kayıp oranımız çok yüksek.|Let's look at the numbers.=Rakamlara bakalım.|The data shows a clear trend.=Veriler net bir eğilim gösteriyor.|Retention went up to 80 percent.=Elde tutma yüzde 80'e çıktı.`,
`A:Let's look at the numbers for this quarter.=Bu çeyreğin rakamlarına bakalım.|B:Sales increased by twenty percent.=Satışlar yüzde yirmi arttı.|A:Great. What about churn?=Harika. Peki müşteri kaybı?|B:It's still too high. Many users leave after one month.=Hâlâ çok yüksek. Birçok kullanıcı bir ay sonra ayrılıyor.|A:What's the main insight?=Ana içgörü ne?|B:New users need better onboarding.=Yeni kullanıcılar daha iyi bir başlangıç deneyimine ihtiyaç duyuyor.`],
["B2","Söz aktarma","🗨️",`Birinin sözünü aktarırken zaman bir geri kayar: <i>"I'm busy" → He said (that) he <b>was</b> busy.</i> <b>say</b> kişisiz (said that), <b>tell</b> kişiyle kullanılır (told me that). Soru aktarımı: <i>They asked <b>if / whether</b> ...</i>`,
`said=söyledi|told=birine söyledi|asked=sordu|explained=açıkladı|mentioned=bahsetti|promised=söz verdi|suggested=önerdi|claimed=iddia etti|admitted=itiraf etti|replied=cevap verdi|whether=-ip -mediği|according to=... göre`,
`He said he was busy.=Meşgul olduğunu söyledi.|She told me that the deal was closed.=Bana anlaşmanın kapandığını söyledi.|They asked if we could ship faster.=Daha hızlı gönderip gönderemeyeceğimizi sordular.|The client mentioned a problem.=Müşteri bir sorundan bahsetti.|He promised to call back.=Geri arayacağına söz verdi.`,
`A:What did the supplier say?=Tedarikçi ne dedi?|B:He said the shipment was delayed.=Sevkiyatın geciktiğini söyledi.|A:Again? Did he explain why?=Yine mi? Nedenini açıkladı mı?|B:He mentioned a problem at customs.=Gümrükte bir sorundan bahsetti.|A:Did he promise a new date?=Yeni bir tarih için söz verdi mi?|B:He told me it would arrive on Monday.=Pazartesi geleceğini söyledi.`],
["B2","Keşke ve pişmanlık","🔁",`Geçmişle ilgili hayali durum: <b>If + had V3, would have V3</b>: <i>If I had known, I would have helped.</i> Pişmanlık: <b>should have V3</b> (...meliydim), <b>I wish I had V3</b> (Keşke ...seydim). Konuşmada kısalır: <i>would've, should've</i>.`,
`should have=-meliydi|could have=-ebilirdi|would have=-erdi|if only=keşke|regret=pişman olmak|mistake=hata|lesson=ders|wish=dilemek|missed=kaçırdı|opportunity=fırsat|in hindsight=geriye dönüp bakınca|learn from=-den ders almak`,
`If I had known, I would have helped.=Bilseydim yardım ederdim.|I should have started earlier.=Daha erken başlamalıydım.|We missed a great opportunity.=Harika bir fırsatı kaçırdık.|I wish I had listened.=Keşke dinleseydim.|It was a good lesson.=İyi bir ders oldu.|Learn from your mistakes.=Hatalarından ders al.`,
`A:Why did the launch fail?=Lansman neden başarısız oldu?|B:In hindsight, we should have tested it with real users.=Geriye dönüp bakınca, gerçek kullanıcılarla test etmeliydik.|A:If we had tested it, we would have found the bugs.=Test etseydik hataları bulurduk.|B:Exactly. I wish I had listened to the team.=Aynen. Keşke ekibi dinleseydim.|A:Well, it was a good lesson.=Neyse, iyi bir ders oldu.|B:True. Next time we'll do better.=Doğru. Bir dahaki sefere daha iyisini yapacağız.`],
["B2","Phrasal verb'ler","🧩",`Phrasal verb = fiil + edat; anlamı çoğu zaman tahmin edilemez: <b>figure out</b> (çözmek, anlamak), <b>come up with</b> (fikir bulmak), <b>run out of</b> (tükenmek), <b>look into</b> (incelemek). Anadili İngilizce olanlar bunları resmi kelimelerden çok daha sık kullanır.`,
`set up=kurmak|figure out=çözmek, anlamak|come up with=(fikir) bulmak|run out of=tükenmek|follow up=takip etmek|carry out=yürütmek|give up=pes etmek|take over=devralmak|look into=incelemek|point out=belirtmek|put off=ertelemek|deal with=ilgilenmek, başa çıkmak`,
`We need to figure out a solution.=Bir çözüm bulmamız lazım.|She came up with a great idea.=Harika bir fikir buldu.|We ran out of stock.=Stoğumuz tükendi.|I'll look into it.=Onu inceleyeceğim.|Don't give up!=Pes etme!|Stop putting it off.=Ertelemeyi bırak.`,
`A:We ran out of our best-selling product again.=En çok satan ürünümüz yine tükendi.|B:We need to figure out a better system.=Daha iyi bir sistem bulmamız lazım.|A:Can you look into inventory software?=Envanter yazılımlarını inceleyebilir misin?|B:Sure. I'll come up with a few options.=Tabii. Birkaç seçenek bulurum.|A:Great. Let's not put it off this time.=Harika. Bu sefer ertelemeyelim.|B:Agreed. I'll follow up on Friday.=Anlaştık. Cuma günü takip ederim.`],
["B2","Liderlik ve ekip","🧭",`Yönetim fiilleri: <b>manage</b> (yönetmek), <b>lead</b> (liderlik etmek), <b>delegate</b> (görev devretmek), <b>hire</b> (işe almak). Sorumluluk bildirmek: <i>I'm responsible for ...</i> / <i>I'm in charge of ...</i>`,
`manage=yönetmek|lead=liderlik etmek|delegate=görev devretmek|motivate=motive etmek|hire=işe almak|fire=işten çıkarmak|responsibility=sorumluluk|culture=kültür|remote team=uzaktan ekip|in charge of=-den sorumlu|burnout=tükenmişlik|trust=güvenmek, güven`,
`I'm responsible for the marketing team.=Pazarlama ekibinden sorumluyum.|We're hiring developers.=Yazılımcı alıyoruz.|Trust your team.=Ekibine güven.|Let's delegate this task.=Bu işi devredelim.|Who's in charge of this project?=Bu projeden kim sorumlu?|Avoid burnout.=Tükenmişlikten kaçın.`,
`A:How big is your team now?=Ekibin şu an ne kadar büyük?|B:Twelve people. We're hiring two more developers.=On iki kişi. İki yazılımcı daha alıyoruz.|A:How do you manage a remote team?=Uzaktan ekibi nasıl yönetiyorsun?|B:Clear goals and lots of trust. I don't micromanage.=Net hedefler ve bol güven. Her şeye karışmam.|A:Do you delegate a lot?=Çok görev devrediyor musun?|B:Yes, otherwise I'd burn out.=Evet, yoksa tükenirim.`],
["B2","Tartışma ve ikna","🧠",`İki taraflı düşünce: <b>On the one hand ... on the other hand ...</b> Zıtlık: <b>although</b> + cümle; <b>however</b> yeni cümlenin başında. Sonuç: <b>Overall / All in all</b> (Genel olarak).`,
`argue=savunmak, tartışmak|convince=ikna etmek|evidence=kanıt|however=ancak|although=-e rağmen|on the other hand=öte yandan|pros and cons=artılar ve eksiler|benefit=fayda|drawback=dezavantaj|overall=genel olarak|therefore=bu nedenle|worth it=değer`,
`On the other hand, it's expensive.=Öte yandan pahalı.|Although it's risky, it's worth it.=Riskli olsa da buna değer.|Let's weigh the pros and cons.=Artıları ve eksileri tartalım.|Overall, I think it's a good plan.=Genel olarak bence iyi bir plan.|What's the evidence?=Kanıt ne?|You've convinced me.=Beni ikna ettin.`,
`A:Should we open a physical store?=Fiziksel bir mağaza açmalı mıyız?|B:Let's weigh the pros and cons.=Artıları ve eksileri tartalım.|A:On the one hand, customers can see the products.=Bir yandan müşteriler ürünleri görebilir.|B:On the other hand, rent is very expensive.=Öte yandan kira çok pahalı.|A:Although it's risky, I think it's worth it.=Riskli olsa da bence buna değer.|B:OK, show me the numbers and convince me.=Tamam, rakamları göster ve beni ikna et.`],
["B2","Ürün geliştirme","🧪",`Ürün dili: <b>MVP</b> (en basit çalışan ürün), <b>feature</b> (özellik), <b>roadmap</b> (yol haritası), <b>iterate</b> (adım adım geliştirmek), <b>ship</b> (yayına almak). Her kararın merkezinde <i>user feedback</i> olmalı.`,
`feature=özellik|user=kullanıcı|feedback=geri bildirim|roadmap=yol haritası|prototype=prototip|MVP=ilk basit ürün|iterate=adım adım geliştirmek|test=test etmek|design=tasarım|user experience=kullanıcı deneyimi|requirement=gereksinim|ship=yayına almak`,
`We built an MVP in two months.=İki ayda bir MVP geliştirdik.|Users love this feature.=Kullanıcılar bu özelliği çok seviyor.|What's on the roadmap?=Yol haritasında ne var?|Let's test it with real users.=Gerçek kullanıcılarla test edelim.|We ship updates every week.=Her hafta güncelleme yayınlıyoruz.`,
`A:What did users say about the new feature?=Kullanıcılar yeni özellik hakkında ne dedi?|B:Most feedback is positive, but it's a bit confusing.=Geri bildirimlerin çoğu olumlu ama biraz kafa karıştırıcı.|A:So we should improve the user experience.=O zaman kullanıcı deneyimini iyileştirmeliyiz.|B:Yes. I'll make a new prototype this week.=Evet. Bu hafta yeni bir prototip yapacağım.|A:Great. Let's test it before we ship.=Harika. Yayına almadan test edelim.`],
["B2","Kriz yönetimi","🚨",`Kriz iletişimi dört adımdır: farkındalık (<b>We're aware of the issue</b>), çözüm (<b>We're working on a fix</b>), özür (<b>We apologize for ...</b>) ve telafi (<b>As compensation, ...</b>). Şeffaflık (<i>transparency</i>) güven kazandırır.`,
`issue=sorun|urgent=acil|delay=gecikme|apologize=özür dilemek|solution=çözüm|immediately=hemen|handle=halletmek|backup=yedek|compensate=telafi etmek|transparent=şeffaf|outage=kesinti|affected=etkilenen`,
`We're aware of the issue.=Sorunun farkındayız.|We're working on a fix.=Bir çözüm üzerinde çalışıyoruz.|We apologize for the delay.=Gecikme için özür dileriz.|This is our top priority.=Bu bizim en büyük önceliğimiz.|All affected customers will get a refund.=Etkilenen tüm müşteriler para iadesi alacak.`,
`A:The website is down! Customers can't pay.=Site çöktü! Müşteriler ödeme yapamıyor.|B:OK, stay calm. Is the backup server working?=Tamam, sakin ol. Yedek sunucu çalışıyor mu?|A:Not yet. The team is working on a fix.=Henüz değil. Ekip çözüm üzerinde çalışıyor.|B:Post a message: we're aware of the issue.=Bir mesaj yayınla: sorunun farkındayız.|A:Should we compensate customers?=Müşterileri telafi etmeli miyiz?|B:Yes, give everyone affected a discount code.=Evet, etkilenen herkese indirim kodu ver.`],
["B2","İş görüşmesi","🎤",`<b>Tell me about yourself</b> sorusuna 1 dakikalık bir özet hazırla: şimdiki iş, geçmiş deneyim, neden bu pozisyon. Başarıları geçmiş zamanla ve sayılarla anlat: <i>I increased sales by 30 percent.</i>`,

`What's the matter?=Sorun ne?|My back hurts.=Sırtım ağrıyor.|I have a fever.=Ateşim var.|I need a doctor.=Doktora ihtiyacım var.|Take this twice a day.=Bunu günde iki kez al.`,

["A1","Meslekler","👩‍💻",`Meslek söylerken <b>a/an</b> şart: <i>I'm <b>an</b> engineer. She's <b>a</b> designer.</i> Sesli harfle başlayanlarda <b>an</b> kullanılır. Meslek sormak: <b>What do you do?</b> Cevap: <i>I work as a developer. I work for a bank.</i>`,

`What do you do?=Ne iş yapıyorsun?|I'm a web designer.=Web tasarımcısıyım.|I work for a tech company.=Bir teknoloji şirketinde çalışıyorum.|I'm a freelancer.=Serbest çalışıyorum.|Do you like your job?=İşini seviyor musun?`,

["A1","İnsanları tanımlamak","🧑",`Görünüş: <b>She is tall.</b> / <b>He has short hair.</b> Kişilik: <i>He's friendly.</i> Benzemek: <b>look like</b> (<i>You look like your father.</i>). Dikkat: <b>What's he like?</b> = Nasıl biri? (kişilik), <b>What does he look like?</b> = Nasıl görünüyor? (dış görünüş)`,
`tall=uzun boylu|short=kısa|young=genç|old=yaşlı|hair=saç|eyes=gözler|friendly=cana yakın|funny=komik|kind=nazik|smart=zeki|quiet=sessiz|look like=benzemek`,
`What does she look like?=Nasıl görünüyor?|He has short black hair.=Kısa siyah saçları var.|She's very friendly.=Çok cana yakın.|You look like your mother.=Annene benziyorsun.|What's he like?=Nasıl biri?`,
`A:Who is your new manager?=Yeni müdürün kim?|B:Her name is Selin. She's young and smart.=Adı Selin. Genç ve zeki.|A:What's she like?=Nasıl biri?|B:She's very kind, and funny too.=Çok nazik, komik de.|A:Lucky you! My boss is really quiet.=Şanslısın! Benim patron çok sessiz.`],
["A2","Restoranda","🍽️",`Kibar sipariş: <b>I'd like</b> (= I would like) + isim: <i>I'd like the soup.</i> Teklif: <b>Would you like…?</b> Öneri istemek: <i>What do you recommend?</i> Garsona "I want" demek kaba kaçabilir!`,

`I'd like to book a table for two.=İki kişilik masa ayırtmak istiyorum.|What do you recommend?=Ne önerirsiniz?|I'm allergic to nuts.=Kuruyemişe alerjim var.|Could we have the bill, please?=Hesabı alabilir miyiz lütfen?|Is service included?=Servis ücreti dahil mi?`,
`A:Are you ready to order?=Sipariş vermeye hazır mısınız?|B:Yes. What do you recommend?=Evet. Ne önerirsiniz?|A:The grilled fish is very popular today.=Izgara balık bugün çok popüler.|B:Great, I'd like the fish. Is it spicy?=Harika, balık alayım. Acı mı?|A:No, not at all. Would you like a starter?=Hayır, hiç değil. Başlangıç ister misiniz?|B:Just a salad, please.=Sadece salata, lütfen.`],
["A2","Para ve banka","🏦",`<b>spend</b> (harcamak) + <b>on</b>: <i>I spend a lot on clothes.</i> <b>cost</b>: <i>It costs 100 lira.</i> Gücü yetmek: <b>afford</b>: <i>I can't afford it.</i> Geçmiş halleri: spend → <b>spent</b>, cost → <b>cost</b>, pay → <b>paid</b>.`,

["A2","Kargo ve teslimat","📦",`Kargo mesajlarında <b>Present Continuous</b> ve <b>will</b> çok geçer: <i>Your package <b>is</b> on its way. It <b>will arrive</b> tomorrow.</i> <b>deliver</b> = teslim etmek, <b>delivery</b> = teslimat.`,

["A2","Ürün yorumları","⭐",`Yorumlarda geçmiş zaman ve sıfatlar çok kullanılır. <b>-ed</b> hissi anlatır (<i>I'm disappointed</i>), <b>-ing</b> sebebi anlatır (<i>It's disappointing</i>). <b>worth</b> = değer: <i>It's worth the money.</i>`,
`review=yorum, inceleme|rating=puan|stars=yıldız|quality=kalite|worth=değer|comfortable=rahat|disappointed=hayal kırıklığına uğramış|satisfied=memnun|fits=tam oluyor|broken=kırık, bozuk|recommend=tavsiye etmek|value for money=fiyat/performans`,
`Highly recommended!=Kesinlikle tavsiye ederim!|It's worth the money.=Parasına değer.|The quality is great.=Kalitesi harika.|I was disappointed.=Hayal kırıklığına uğradım.|It fits perfectly.=Tam oldu.`,
`A:Should I buy these headphones?=Bu kulaklıkları almalı mıyım?|B:Check the reviews first.=Önce yorumlara bak.|A:They have 4.5 stars. People say the sound quality is great.=4,5 yıldızları var. Ses kalitesi harika diyorlar.|B:Any bad reviews?=Kötü yorum var mı?|A:Some people say they're not comfortable.=Bazıları rahat olmadığını söylüyor.|B:Then try them in a store first.=O zaman önce mağazada dene.`],
["A2","Ev kiralamak","🔑",`<b>rent</b> hem isim (kira) hem fiildir (kiralamak). <b>How much is the rent?</b> Fiyata dahil mi: <i>Are bills included?</i> <b>landlord</b> = ev sahibi, <b>tenant</b> = kiracı.`,

["A2","Öğrenme ve kurslar","🎓",`Gelişmeyi anlatmak: <b>improve</b> / <b>get better</b>: <i>My English is getting better.</i> Sınav: <b>take an exam</b> (sınava girmek), <b>pass</b> (geçmek), <b>fail</b> (kalmak). Hata yapmak <b>make a mistake</b>'tir, "do" değil!`,

`I'm learning English.=İngilizce öğreniyorum.|I practice every day.=Her gün pratik yapıyorum.|I made a mistake.=Hata yaptım.|I passed the exam!=Sınavı geçtim!|How can I improve my speaking?=Konuşmamı nasıl geliştirebilirim?`,

["A2","Davetler ve kutlamalar","🎉",`Kibar davet: <b>Would you like to come?</b> Kabul: <i>I'd love to!</i> Ret: <i>I'd love to, but I can't.</i> Eğlendiğini anlatmak: <b>I had a great time.</b> Tebrik: <b>Congratulations on</b> + isim.`,

["A2","Abonelikler","🧾",`Abonelik dili: <b>free trial</b> (ücretsiz deneme), <b>per month</b> (aylık), <b>cancel anytime</b> (istediğin zaman iptal). Sık görülen uyarı: <i>You <b>will be charged</b> on 1 May.</i> (1 Mayıs'ta ücret alınacak.)`,

["A2","Online güvenlik","🔐",`Uyarılarda emir kipi ve <b>never</b> çok geçer: <i>Never share your code.</i> Şüpheli = <b>suspicious</b>. Kötü bir olayı anlatırken edilgen yapı: <i>My account <b>was hacked</b>.</i> (Hesabım ele geçirildi.)`,

["A2","Freelance iş","🧑‍💻",`Ücret sormak: <b>What's your rate?</b> <b>per hour</b> = saatlik. Fiyat teklifi: <b>a quote</b>. Plan anlatmak: <b>going to</b> + fiil: <i>I'm going to send the first draft on Monday.</i>`,

["B1","İş planı","📝",`Gelecek planları: <b>will</b> (tahmin, anlık karar), <b>be going to</b> (plan), <b>aim to / plan to</b> + fiil: <i>We aim to break even in 18 months.</i> Hedef = <b>goal / target</b>.`,
