["B1","SEO ve içerik","🔎",`Artışı anlatan karşılaştırma yapısı: <b>the more … the more</b>: <i>The more content you publish, the more traffic you get.</i> Amaç bildirmek: <b>so that</b>: <i>We use keywords so that people can find us.</i>`,
`search engine=arama motoru|keyword=anahtar kelime|ranking=sıralama|traffic=trafik (ziyaretçi)|blog post=blog yazısı|optimize=optimize etmek|organic=organik|visibility=görünürlük|headline=başlık|bounce rate=hemen çıkma oranı|backlink=geri bağlantı|visitors=ziyaretçiler`,
`We need more organic traffic.=Daha fazla organik trafiğe ihtiyacımız var.|Let's optimize the product pages.=Ürün sayfalarını optimize edelim.|Which keywords should we target?=Hangi anahtar kelimeleri hedeflemeliyiz?|We're on the first page of Google!=Google'ın ilk sayfasındayız!|The more you write, the more visitors you get.=Ne kadar çok yazarsan o kadar çok ziyaretçi gelir.`,
`A:Our website traffic dropped this month.=Web sitemizin trafiği bu ay düştü.|B:Did you check our Google ranking?=Google sıralamamıza baktın mı?|A:Yes, we're on page three for our main keyword.=Evet, ana anahtar kelimemizde üçüncü sayfadayız.|B:We need fresh content. Let's write a blog post every week.=Yeni içeriğe ihtiyacımız var. Her hafta bir blog yazısı yazalım.|A:And the product pages load slowly. That hurts SEO too.=Bir de ürün sayfaları yavaş açılıyor. Bu da SEO'ya zarar veriyor.|B:Good point. Let's optimize them first.=Haklısın. Önce onları optimize edelim.`],
["B1","Telefonda iş","📞",`Telefonda kendini tanıtırken <b>This is …</b> denir ("I am" değil!). Kibar istek: <b>Could I speak to …?</b> Bekletmek: <b>Hold on, please.</b> Anlamadığında: <i>Could you repeat that, please?</i>`,
`speaking=benim (telefonda)|hold on=hatta kalmak|put through=bağlamak|extension=dahili numara|leave a message=mesaj bırakmak|take a message=mesaj almak|busy=meşgul|bad line=kötü hat|spell=harf harf söylemek|repeat=tekrarlamak|get back to=dönüş yapmak|surname=soyadı`,
`Hello, this is Deniz from Rota Tech.=Merhaba, ben Rota Tech'ten Deniz.|Could I speak to Mr. Smith, please?=Bay Smith ile görüşebilir miyim lütfen?|Hold on, I'll put you through.=Hatta kalın, sizi bağlıyorum.|Could you spell your name, please?=Adınızı harf harf söyler misiniz?|I'll get back to you today.=Bugün size dönüş yapacağım.`,
`A:Good morning, Nova Logistics. How can I help you?=Günaydın, Nova Lojistik. Size nasıl yardımcı olabilirim?|B:Hello, this is Ayşe from Rota Store. Could I speak to Mark?=Merhaba, ben Rota Store'dan Ayşe. Mark ile görüşebilir miyim?|A:I'm afraid he's in a meeting. Can I take a message?=Maalesef toplantıda. Mesajınızı alabilir miyim?|B:Yes, please. Can he call me back about our shipment?=Evet lütfen. Sevkiyatımızla ilgili beni geri arayabilir mi?|A:Of course. Could you spell your surname?=Tabii. Soyadınızı harf harf söyler misiniz?|B:Sure. K-A-Y-A.=Tabii. K-A-Y-A.`],
["B1","Fatura ve ödeme","💳",`Resmi hatırlatmalarda <b>kindly</b> ve <b>please note</b> sık geçer: <i>Please note that the payment is overdue.</i> Süre: <b>within</b> 30 days (30 gün içinde), <b>by</b> Friday (cumaya kadar).`,
`invoice=fatura|due date=son ödeme tarihi|overdue=vadesi geçmiş|payment terms=ödeme koşulları|bank transfer=banka havalesi|VAT=KDV|tax=vergi|late fee=gecikme ücreti|currency=para birimi|amount=tutar|reminder=hatırlatma|paid=ödendi`,
`Please find the invoice attached.=Faturayı ekte bulabilirsiniz.|Payment is due within 30 days.=Ödeme 30 gün içinde yapılmalıdır.|This invoice is overdue.=Bu faturanın vadesi geçti.|Does the price include VAT?=Fiyata KDV dahil mi?|We have received your payment.=Ödemenizi aldık.`,
`A:Hi Tom, just a quick reminder about invoice 205.=Merhaba Tom, 205 numaralı fatura için kısa bir hatırlatma.|B:Oh, sorry! Was it due last week?=Aa, kusura bakma! Geçen hafta mı ödenmesi gerekiyordu?|A:Yes, it's now ten days overdue.=Evet, vadesi on gün geçti.|B:I'll make a bank transfer today.=Bugün banka havalesi yapacağım.|A:Thanks. Please use the invoice number as the reference.=Teşekkürler. Açıklamaya fatura numarasını yazın lütfen.|B:Will do. Sorry again for the delay.=Tamamdır. Gecikme için tekrar özür dilerim.`],
["B1","Influencer iş birliği","🤳",`Teklif ve öneri: <b>We'd like to …</b> (… istiyoruz), <b>Would you be interested in …ing?</b> (… ile ilgilenir misiniz?). <i>interested <b>in</b></i> sonrasında fiil <b>-ing</b> alır.`,
`collaboration=iş birliği|sponsored=sponsorlu|partnership=ortaklık|commission=komisyon|affiliate link=satış ortaklığı linki|promo code=promosyon kodu|niche=niş|authentic=samimi, gerçek|deliverables=teslim edilecekler|rate card=fiyat listesi|followers=takipçiler|engagement rate=etkileşim oranı`,
`Would you be interested in a collaboration?=Bir iş birliğiyle ilgilenir misiniz?|We'd like to send you our product.=Size ürünümüzü göndermek istiyoruz.|Could you share your rate card?=Fiyat listenizi paylaşabilir misiniz?|Use my promo code for 15% off.=%15 indirim için kodumu kullanın.|This post is sponsored.=Bu gönderi sponsorludur.`,
`A:Hi Elif! We love your content. Would you be interested in a collaboration?=Merhaba Elif! İçeriklerine bayılıyoruz. Bir iş birliğiyle ilgilenir misin?|B:Thanks! What did you have in mind?=Teşekkürler! Aklınızda ne var?|A:Two stories and one reel about our new skincare line.=Yeni cilt bakım serimiz hakkında iki hikâye ve bir reels.|B:Sounds good. I only promote products I really use.=Kulağa iyi geliyor. Sadece gerçekten kullandığım ürünleri tanıtırım.|A:Of course. We'll send samples first. Could you share your rate card?=Elbette. Önce numune göndereceğiz. Fiyat listeni paylaşır mısın?|B:Sure, I'll email it to you today.=Tabii, bugün e-postayla gönderirim.`],
["B1","Tedarik ve lojistik","🚚",`Süreç anlatırken edilgen yapı: <i>The goods <b>are shipped</b> within two days.</i> Gelecekte edilgen: <b>will be</b> + V3: <i>Your order <b>will be delivered</b> on Friday.</i>`,
`warehouse=depo|shipment=sevkiyat|customs=gümrük|lead time=tedarik süresi|restock=stok yenilemek|out of stock=stokta yok|packaging=ambalaj|logistics=lojistik|minimum order=minimum sipariş|sample=numune|manufacturer=üretici|supplier=tedarikçi`,
`What's your lead time?=Tedarik süreniz ne kadar?|The shipment is stuck in customs.=Sevkiyat gümrükte takıldı.|We're out of stock on size M.=M bedende stokumuz kalmadı.|Can you send us a sample first?=Önce bize numune gönderebilir misiniz?|It will be restocked next week.=Gelecek hafta stoğa eklenecek.`,
`A:Our bestseller is out of stock again.=En çok satan ürünümüz yine tükendi.|B:When is the next shipment coming?=Bir sonraki sevkiyat ne zaman geliyor?|A:It was sent last week, but it's stuck in customs.=Geçen hafta gönderildi ama gümrükte takıldı.|B:We need a second supplier. The lead time is too long.=İkinci bir tedarikçiye ihtiyacımız var. Tedarik süresi çok uzun.|A:I agree. I found a manufacturer in Bursa.=Katılıyorum. Bursa'da bir üretici buldum.|B:Great. Let's ask them for a sample.=Harika. Onlardan numune isteyelim.`],
["B1","Uygulama tanıtımı","📱",`Ürün tanıtırken <b>let / help / allow</b> çok işe yarar: <i>Our app <b>lets</b> you track expenses.</i> (let + fiil), <i>It <b>helps</b> you save time.</i>, <i>It <b>allows</b> you <b>to</b> share files.</i> (allow + to + fiil)`,
`user-friendly=kullanıcı dostu|available=mevcut|free version=ücretsiz sürüm|subscribe=abone olmak|compatible=uyumlu|integrate=entegre olmak|feature=özellik|track=takip etmek|sync=senkronize etmek|download=indirmek|launch=piyasaya sürmek|lets you=… yapmanı sağlar`,
`Our app lets you track your expenses.=Uygulamamız harcamalarını takip etmeni sağlar.|It's available on iOS and Android.=iOS ve Android'de mevcut.|It integrates with Google Calendar.=Google Takvim ile entegre çalışır.|There's a free version.=Ücretsiz bir sürümü var.|It saves you hours every week.=Sana her hafta saatler kazandırır.`,
`A:So, what does your app do?=Peki, uygulaman ne yapıyor?|B:It helps small shops manage their stock.=Küçük dükkânların stoklarını yönetmesine yardım ediyor.|A:Is it hard to use?=Kullanması zor mu?|B:Not at all. It's really user-friendly. It lets you scan products with your phone.=Hiç değil. Çok kullanıcı dostu. Ürünleri telefonunla taramanı sağlıyor.|A:Does it work with online stores?=Online mağazalarla çalışıyor mu?|B:Yes, it integrates with Shopify and Trendyol.=Evet, Shopify ve Trendyol ile entegre çalışıyor.`],
["B1","Verimlilik","🎯",`<b>Gerund</b> (fiil + ing) cümlede isim gibi kullanılır: <i><b>Planning</b> your day saves time.</i> Bazı fiillerden sonra hep -ing gelir: <b>avoid, stop, keep, finish</b>: <i>Stop checking your phone!</i>`,
`productive=verimli|focus=odaklanmak|distraction=dikkat dağıtıcı|habit=alışkanlık|to-do list=yapılacaklar listesi|prioritize=önceliklendirmek|procrastinate=ertelemek|time management=zaman yönetimi|achieve=başarmak|break=mola|avoid=kaçınmak|keep=sürdürmek`,
`I keep procrastinating.=Sürekli erteliyorum.|Stop checking your phone every five minutes.=Beş dakikada bir telefonuna bakmayı bırak.|Start with the hardest task.=En zor işle başla.|Take a short break every hour.=Her saat kısa bir mola ver.|Writing a to-do list helps me focus.=Yapılacaklar listesi yazmak odaklanmama yardım ediyor.`,
`A:I work all day, but I don't finish anything.=Bütün gün çalışıyorum ama hiçbir şeyi bitiremiyorum.|B:Do you make a to-do list?=Yapılacaklar listesi yapıyor musun?|A:Yes, but it's too long. And I keep checking Instagram.=Evet ama çok uzun. Bir de sürekli Instagram'a bakıyorum.|B:Try prioritizing three tasks a day. Put your phone in another room.=Günde üç görevi önceliklendirmeyi dene. Telefonunu başka odaya koy.|A:Three tasks only?=Sadece üç görev mi?|B:Yes. Finishing three is better than starting ten.=Evet. Üç işi bitirmek, on işe başlamaktan iyidir.`],
["B1","Kültürler arası iletişim","🌏",`Genelleme yaparken <b>tend to</b> (… eğiliminde olmak): <i>Americans <b>tend to</b> be direct.</i> Tavsiye: <b>It's better to …</b> Karşılaştırma: <i>In Turkey, people …, <b>whereas</b> in the UK …</i>`,
`culture=kültür|formal=resmi|informal=samimi, gayriresmi|polite=kibar|direct=doğrudan|indirect=dolaylı|small talk=havadan sudan sohbet|custom=gelenek|respect=saygı|misunderstanding=yanlış anlaşılma|adapt=uyum sağlamak|tend to=eğiliminde olmak`,
`In the UK, people tend to be indirect.=İngiltere'de insanlar dolaylı konuşma eğilimindedir.|It's better to use first names.=İlk isimle hitap etmek daha iyi.|Small talk is important here.=Burada havadan sudan sohbet önemlidir.|I didn't mean to be rude.=Kaba olmak istemedim.|Let's avoid any misunderstanding.=Yanlış anlaşılmadan kaçınalım.`,
`A:My British client said my idea was interesting. Is that good?=İngiliz müşterim fikrimin ilginç olduğunu söyledi. Bu iyi mi?|B:Hmm, not always. British people tend to be indirect.=Hmm, her zaman değil. İngilizler dolaylı konuşma eğilimindedir.|A:Really? In Turkey, we say it directly.=Gerçekten mi? Türkiye'de açıkça söyleriz.|B:Exactly. Interesting sometimes means I don't like it.=Aynen. İlginç bazen beğenmedim demek.|A:Wow. I should ask more questions next time.=Vay. Bir dahaki sefere daha çok soru sormalıyım.|B:Good idea. It's better to check than to guess.=İyi fikir. Tahmin etmek yerine sormak daha iyi.`],
["B1","Bağlaçlar ve akıcılık","🔗",`Bağlaçlar konuşmayı akıcı yapar. Sebep: <b>because, since</b>. Sonuç: <b>so, as a result</b>. Zıtlık: <b>but, however, instead</b>. Ekleme: <b>also, besides, in addition</b>. Örnek: <b>for example, such as</b>. <i>However</i> genelde cümle başında, virgülle gelir.`,
`because=çünkü|so=bu yüzden|but=ama|also=ayrıca|besides=üstelik|instead=bunun yerine|as a result=sonuç olarak|for example=örneğin|such as=… gibi|in addition=buna ek olarak|since=-dığı için|in fact=aslında`,
`I stayed home because it was raining.=Yağmur yağdığı için evde kaldım.|It was expensive. However, it was worth it.=Pahalıydı. Ancak buna değdi.|Let's call them instead.=Onun yerine onları arayalım.|As a result, sales went up.=Sonuç olarak satışlar arttı.|We sell accessories such as bags and hats.=Çanta ve şapka gibi aksesuarlar satıyoruz.`,
`A:Why did you change your supplier?=Tedarikçini neden değiştirdin?|B:Because the old one was always late. Besides, the quality was dropping.=Çünkü eskisi hep geç kalıyordu. Üstelik kalite düşüyordu.|A:Is the new one more expensive?=Yenisi daha mı pahalı?|B:A little. However, they deliver in three days.=Biraz. Ancak üç günde teslim ediyorlar.|A:So your customers get their orders faster.=Yani müşterilerin siparişlerini daha hızlı alıyor.|B:Exactly. As a result, our reviews got much better.=Aynen. Sonuç olarak yorumlarımız çok iyileşti.`],
["B1","Rakamları konuşmak","🧮",`Yaklaşık rakam: <b>around / about / roughly</b> 500. Değişim: <b>rise / go up</b> (artmak), <b>fall / drop</b> (düşmek) + <b>by</b> (… kadar): <i>Sales rose <b>by</b> 20%.</i> İngilizcede ondalık için nokta kullanılır: <i>1.5 million = one point five million</i>.`,
`around=civarında|roughly=kabaca|double=ikiye katlamak|half=yarı|a third=üçte bir|million=milyon|billion=milyar|average=ortalama|total=toplam|rise=artmak|drop=düşmek|per cent=yüzde`,
`Sales rose by 20% last year.=Satışlar geçen yıl %20 arttı.|We have around 5,000 customers.=Yaklaşık 5.000 müşterimiz var.|The average order is 45 dollars.=Ortalama sipariş 45 dolar.|Our revenue doubled.=Gelirimiz ikiye katlandı.|About a third of users come from Instagram.=Kullanıcıların yaklaşık üçte biri Instagram'dan geliyor.`,
`A:How was the month?=Ay nasıl geçti?|B:Pretty good. We had roughly 1,200 orders.=Oldukça iyi. Kabaca 1.200 sipariş aldık.|A:That's almost double last month!=Bu neredeyse geçen ayın iki katı!|B:Yes, but the average order value dropped by 8%.=Evet ama ortalama sipariş tutarı %8 düştü.|A:Why?=Neden?|B:Because half of the orders used a discount code.=Çünkü siparişlerin yarısında indirim kodu kullanıldı.`],
["B2","Sözleşmeler","📜",`Resmi dilde <b>shall</b> (yükümlülük), <b>provided that</b> (… şartıyla), <b>unless otherwise agreed</b> (aksi kararlaştırılmadıkça) sık geçer: <i>The supplier <b>shall</b> deliver within 14 days.</i>`,
`clause=madde|terms and conditions=şartlar ve koşullar|liability=sorumluluk|breach=ihlal|termination=fesih|confidential=gizli|NDA=gizlilik sözleşmesi|binding=bağlayıcı|obligation=yükümlülük|draft=taslak|provided that=… şartıyla|signature=imza`,
`Could you send us the draft contract?=Sözleşme taslağını gönderebilir misiniz?|We need to sign an NDA first.=Önce gizlilik sözleşmesi imzalamamız gerekiyor.|Clause 7 needs to be changed.=7. maddenin değiştirilmesi gerekiyor.|This would be a breach of contract.=Bu, sözleşme ihlali olur.|We agree, provided that payment is made in advance.=Ödemenin peşin yapılması şartıyla kabul ediyoruz.`,
`A:We've reviewed the contract. Most of it looks fine.=Sözleşmeyi inceledik. Çoğu iyi görünüyor.|B:Great. Are there any clauses you'd like to change?=Harika. Değiştirmek istediğiniz madde var mı?|A:Yes, clause 9 on liability. It's too broad for us.=Evet, sorumlulukla ilgili 9. madde. Bizim için fazla geniş.|B:I see. What would you suggest?=Anlıyorum. Ne önerirsiniz?|A:We'd like to limit our liability to the value of the order.=Sorumluluğumuzu sipariş tutarıyla sınırlamak istiyoruz.|B:That seems reasonable. I'll check with our legal team.=Makul görünüyor. Hukuk ekibimize danışacağım.`],
["B2","Girişim finansı","💰",`Neden-sonuç için resmi bağlaçlar: <b>due to</b> + isim (<i>due to high costs</i>), <b>therefore</b> (bu nedenle), <b>leading to</b> (… ile sonuçlanan). <i>Our burn rate increased due to new hires.</i>`,
`cash flow=nakit akışı|burn rate=nakit yakma hızı|runway=kalan nakit ömrü|profit margin=kâr marjı|gross=brüt|net=net|expenses=giderler|ROI=yatırım getirisi|bootstrap=kendi imkânıyla büyümek|dilute=hisseyi sulandırmak|due to=… nedeniyle|profitable=kârlı`,
`We have 12 months of runway.=12 aylık nakit ömrümüz var.|Our burn rate is too high.=Nakit yakma hızımız çok yüksek.|We bootstrapped the company for two years.=Şirketi iki yıl kendi imkânlarımızla büyüttük.|Cash flow is more important than profit.=Nakit akışı kârdan daha önemli.|Our margins dropped due to shipping costs.=Kargo maliyetleri nedeniyle marjlarımız düştü.`,
`A:How much runway do we have?=Ne kadar nakit ömrümüz kaldı?|B:About eight months, at our current burn rate.=Mevcut harcama hızıyla yaklaşık sekiz ay.|A:That's not much. Should we raise money?=Bu fazla değil. Yatırım almalı mıyız?|B:Maybe, but it would dilute our shares.=Belki ama bu hisselerimizi sulandırır.|A:What about cutting expenses instead?=Bunun yerine giderleri kısmaya ne dersin?|B:We could. If we cut ads by 30%, we'd be profitable by spring.=Kısabiliriz. Reklamı %30 azaltırsak baharda kâra geçeriz.`],
["B2","Sunum yapmak","🎙️",`Sunumda yol gösteren ifadeler (signposting) dinleyicinin seni takip etmesini kolaylaştırır. Başlangıç: <b>To begin with…</b> Geçiş: <b>Moving on to…</b> Vurgu: <b>I'd like to highlight…</b> Kapanış: <b>To sum up…</b>`,
`presentation=sunum|slide=slayt|outline=ana hatlar|highlight=vurgulamak|illustrate=örneklemek|move on=geçmek|sum up=özetlemek|Q&A=soru-cevap|key takeaway=ana çıkarım|audience=dinleyici|as you can see=gördüğünüz gibi|to begin with=başlangıç olarak`,
`Let me start with a quick outline.=Kısa bir ana hatla başlayayım.|As you can see on this slide, sales grew.=Bu slaytta gördüğünüz gibi satışlar arttı.|Moving on to our results.=Sonuçlarımıza geçelim.|To sum up, we need to act fast.=Özetle, hızlı hareket etmemiz gerekiyor.|I'll take questions at the end.=Soruları sonunda alacağım.`,
`A:Good morning, everyone. Today I'll talk about our Q3 results.=Herkese günaydın. Bugün üçüncü çeyrek sonuçlarımızdan bahsedeceğim.|B:Great. Will you share the slides afterwards?=Harika. Slaytları sonra paylaşacak mısın?|A:Of course. To begin with, as you can see, sales grew by 25%.=Tabii. Başlangıç olarak, gördüğünüz gibi satışlar %25 arttı.|B:Sorry to interrupt, but where did most of the growth come from?=Böldüğüm için kusura bakma ama büyümenin çoğu nereden geldi?|A:Good question. I'll cover that on the next slide.=Güzel soru. Bir sonraki slaytta ona değineceğim.|B:Perfect, thanks.=Mükemmel, teşekkürler.`],
["B2","Sürdürülebilirlik ve etik","🌱",`Görüş bildirirken ihtiyatlı dil (hedging) profesyonel görünür: <b>It could be argued that…</b>, <b>to some extent</b> (bir ölçüde), <b>arguably</b> (tartışmaya açık olsa da). <i>Arguably, consumers care more about price.</i>`,
`sustainable=sürdürülebilir|ethical=etik|transparency=şeffaflık|accountability=hesap verebilirlik|impact=etki|stakeholder=paydaş|carbon footprint=karbon ayak izi|greenwashing=yeşil aklama|fair trade=adil ticaret|long-term=uzun vadeli|to some extent=bir ölçüde|arguably=tartışmaya açık olsa da`,
`Customers expect more transparency.=Müşteriler daha fazla şeffaflık bekliyor.|We want to reduce our carbon footprint.=Karbon ayak izimizi azaltmak istiyoruz.|That sounds like greenwashing.=Bu yeşil aklama gibi görünüyor.|It could be argued that it's too expensive.=Çok pahalı olduğu öne sürülebilir.|We need to think long-term.=Uzun vadeli düşünmemiz gerekiyor.`,
`A:Should we switch to recycled packaging?=Geri dönüştürülmüş ambalaja geçmeli miyiz?|B:It's about 15% more expensive.=Yaklaşık %15 daha pahalı.|A:True, but our customers care about sustainability.=Doğru ama müşterilerimiz sürdürülebilirliği önemsiyor.|B:To some extent. Arguably, most of them still choose the cheapest option.=Bir ölçüde. Tartışmaya açık olsa da çoğu hâlâ en ucuz seçeneği tercih ediyor.|A:Maybe, but it's a long-term investment in our brand.=Belki ama bu markamıza uzun vadeli bir yatırım.|B:Fair point. Let's just be transparent and avoid greenwashing.=Haklısın. Yeter ki şeffaf olalım ve yeşil aklamadan kaçınalım.`],
["B2","Performans görüşmesi","📋",`Yapıcı eleştiri için yumuşatıcılar: <b>One area to work on is…</b>, <b>It might be worth …ing</b>, <b>Have you considered…?</b> Başarıyı vurgulamak: <i>You <b>have exceeded</b> your targets.</i>`,
`performance review=performans değerlendirmesi|promotion=terfi|raise=zam|constructive=yapıcı|expectations=beklentiler|exceed=aşmak|underperform=beklentinin altında kalmak|strengths=güçlü yönler|areas for improvement=gelişim alanları|recognize=takdir etmek|career path=kariyer yolu|mentor=mentor`,
`You've exceeded your targets this year.=Bu yıl hedeflerini aştın.|One area to work on is communication.=Üzerinde çalışılacak bir alan iletişim.|I'd like to discuss a raise.=Zam konusunu konuşmak istiyorum.|Where do you see your career going?=Kariyerini nereye doğru görüyorsun?|Thanks for the constructive feedback.=Yapıcı geri bildirim için teşekkürler.`,
`A:Overall, it's been a great year. You exceeded your sales targets.=Genel olarak harika bir yıl oldu. Satış hedeflerini aştın.|B:Thank you, I really enjoyed the new projects.=Teşekkürler, yeni projelerden çok keyif aldım.|A:One area to work on is delegating. You try to do everything yourself.=Üzerinde çalışılacak bir alan iş dağıtmak. Her şeyi kendin yapmaya çalışıyorsun.|B:That's fair. I'll work on it. Also, I'd like to discuss a possible promotion.=Haklısın. Üzerinde çalışacağım. Ayrıca olası bir terfiyi konuşmak istiyorum.|A:Good timing. Let's talk about your career path.=Tam zamanında. Kariyer yolunu konuşalım.`],
["B2","Marka hikâyesi","✨",`Vurgu için <b>cleft cümleler</b>: <i><b>What</b> makes us different <b>is</b> our service.</i> / <i><b>It was</b> my grandmother <b>who</b> inspired the brand.</i> Bu yapı mesajı güçlü ve akılda kalıcı yapar.`,
`brand story=marka hikâyesi|identity=kimlik|tone of voice=iletişim tonu|positioning=konumlandırma|storytelling=hikâye anlatıcılığı|emotional=duygusal|differentiate=farklılaştırmak|consistent=tutarlı|values=değerler|loyal=sadık|inspire=ilham vermek|premium=üst segment`,
`What makes us different is our story.=Bizi farklı kılan hikâyemiz.|Our tone of voice is friendly but professional.=İletişim tonumuz samimi ama profesyonel.|We need to be consistent across all channels.=Tüm kanallarda tutarlı olmalıyız.|People don't buy products, they buy stories.=İnsanlar ürün değil, hikâye satın alır.|It was my grandmother who inspired the brand.=Markaya ilham veren büyükannemdi.`,
`A:Why should people choose your olive oil over others?=İnsanlar neden başkalarınınki yerine sizin zeytinyağınızı seçsin?|B:What makes us different is our story. It's from my family's farm in Ayvalik.=Bizi farklı kılan hikâyemiz. Ailemin Ayvalık'taki çiftliğinden geliyor.|A:Nice. How do you share that story?=Güzel. Bu hikâyeyi nasıl paylaşıyorsunuz?|B:Through short videos of the harvest. It's very emotional for people.=Hasattan kısa videolarla. İnsanlar için çok duygusal.|A:And what's your positioning?=Peki konumlandırmanız ne?|B:Premium, but honest. Our values are quality and tradition.=Üst segment ama dürüst. Değerlerimiz kalite ve gelenek.`],
["B2","Uluslararası büyüme","🌍",`İleride tamamlanmış olacak işler: <b>Future Perfect</b> = <b>will have</b> + V3: <i>By 2028, we <b>will have entered</b> three new markets.</i> Planlanmış süreç: <b>Future Continuous</b>: <i>We'll be launching in Germany next spring.</i>`,
`expand=genişlemek, açılmak|localize=yerelleştirmek|market entry=pazara giriş|regulations=düzenlemeler|distributor=distribütör|export=ihracat|import=ithalat|overseas=yurt dışı|cross-border=sınır ötesi|scale up=ölçeklemek|by then=o zamana kadar|will have=… olacak (tamamlanmış)`,
`We're planning to expand into Europe.=Avrupa'ya açılmayı planlıyoruz.|We need to localize the website.=Web sitesini yerelleştirmemiz gerekiyor.|Regulations are different in every country.=Düzenlemeler her ülkede farklı.|By next year, we will have opened two offices.=Gelecek yıla kadar iki ofis açmış olacağız.|We'll be launching in Germany in spring.=İlkbaharda Almanya'da lansman yapıyor olacağız.`,
`A:What's your plan for next year?=Gelecek yıl için planınız ne?|B:We're expanding into Germany and the Netherlands.=Almanya ve Hollanda'ya açılıyoruz.|A:Will you open an office there?=Orada ofis açacak mısınız?|B:Not yet. We'll work with a local distributor first.=Henüz değil. Önce yerel bir distribütörle çalışacağız.|A:Smart. What about the website?=Akıllıca. Web sitesi ne olacak?|B:We're localizing it now. By March, we will have translated everything.=Şu an yerelleştiriyoruz. Marta kadar her şeyi çevirmiş olacağız.`],
["B2","Yapay zekâ ve veri","🧠",`Teknik konularda <b>ilgi cümleleri</b> (relative clauses) çok kullanılır: <i>A model <b>that</b> learns from data…</i>, <i>The dataset <b>which</b> we used…</i>. İnsanlar için <b>who</b>: <i>Developers <b>who</b> use AI work faster.</i>`,
`machine learning=makine öğrenmesi|algorithm=algoritma|dataset=veri seti|model=model|train=eğitmek|prompt=istem, komut|bias=önyargı|accuracy=doğruluk|deploy=devreye almak|chatbot=sohbet botu|open source=açık kaynak|automate=otomatikleştirmek`,
`We trained the model on our own data.=Modeli kendi verilerimizle eğittik.|The accuracy is around 95%.=Doğruluk yaklaşık %95.|We need to check the data for bias.=Verileri önyargı açısından kontrol etmemiz gerekiyor.|We can automate most of these tasks.=Bu görevlerin çoğunu otomatikleştirebiliriz.|It's an open-source tool that anyone can use.=Herkesin kullanabileceği açık kaynaklı bir araç.`,
`A:Can AI help us with customer support?=Yapay zekâ müşteri desteğinde bize yardım edebilir mi?|B:Definitely. We could use a chatbot that answers common questions.=Kesinlikle. Sık sorulan soruları yanıtlayan bir sohbet botu kullanabiliriz.|A:How accurate would it be?=Ne kadar doğru olur?|B:If we train it on our old tickets, quite accurate.=Eski destek taleplerimizle eğitirsek oldukça doğru olur.|A:What about difficult cases?=Zor durumlar ne olacak?|B:Those go to a human. AI should support people, not replace them.=Onlar bir insana gider. Yapay zekâ insanları desteklemeli, onların yerini almamalı.`],
["B2","Değişim ve pivot","🔄",`Geçmişte başlayıp hâlâ süren durum için <b>Present Perfect Continuous</b>: <b>have been</b> + V-ing: <i>We <b>have been losing</b> customers for months.</i> Vurgu sonuçta değil, sürede.`,
`pivot=yön değiştirmek|transition=geçiş|restructure=yeniden yapılandırmak|adapt=uyum sağlamak|resistance=direnç|disrupt=altüst etmek|shift=kayma, değişim|outdated=eskimiş|streamline=sadeleştirmek|embrace=benimsemek|overhaul=köklü yenileme|for months=aylardır`,
`We've been losing customers for months.=Aylardır müşteri kaybediyoruz.|It's time to pivot.=Yön değiştirme zamanı.|The market has shifted.=Pazar değişti.|People naturally resist change.=İnsanlar doğal olarak değişime direnir.|We need to streamline our processes.=Süreçlerimizi sadeleştirmemiz gerekiyor.`,
`A:Our sales have been falling for six months.=Satışlarımız altı aydır düşüyor.|B:I know. The market has shifted to mobile, and our app feels outdated.=Biliyorum. Pazar mobile kaydı ve uygulamamız eski kaldı.|A:Should we pivot to a subscription model?=Abonelik modeline mi geçmeliyiz?|B:It's risky, but staying the same is riskier.=Riskli ama aynı kalmak daha riskli.|A:The team might resist the change.=Ekip değişime direnebilir.|B:Then let's involve them early and explain why.=O zaman onları erkenden sürece dahil edip nedenini açıklayalım.`],
["B2","Haber ve medya dili","📰",`Haberlerde mesafeli anlatım: <b>It is reported that…</b>, <b>is said to be</b>, <b>allegedly</b> (iddiaya göre). Manşetlerde yardımcı fiiller düşer ve geçmiş için geniş zaman kullanılır: <i>CEO Quits After Scandal</i> = CEO skandalın ardından istifa etti.`,
`headline=manşet|source=kaynak|reliable=güvenilir|coverage=haber kapsamı|breaking news=son dakika|statement=açıklama|allegedly=iddiaya göre|fake news=sahte haber|journalist=gazeteci|investigation=soruşturma|announce=duyurmak|press release=basın bülteni`,
`Is this source reliable?=Bu kaynak güvenilir mi?|The company released a statement.=Şirket bir açıklama yayınladı.|It is reported that sales fell.=Satışların düştüğü bildiriliyor.|Allegedly, the data was leaked.=İddiaya göre veriler sızdırıldı.|Always check the source before sharing.=Paylaşmadan önce her zaman kaynağı kontrol et.`,
`A:Did you see the news about our competitor?=Rakibimizle ilgili haberi gördün mü?|B:The data leak? Yes, but I'm not sure it's true.=Veri sızıntısı mı? Evet ama doğru olduğundan emin değilim.|A:Several sites are reporting it.=Birkaç site bunu haber yapıyor.|B:Allegedly, yes. But no reliable source has confirmed it.=İddiaya göre evet. Ama güvenilir bir kaynak doğrulamadı.|A:They're going to release a statement this afternoon.=Bu öğleden sonra açıklama yapacaklar.|B:Let's wait for that before we comment.=Yorum yapmadan önce onu bekleyelim.`],
["B2","Zor konuşmalar","😤",`Zor konuşmada <b>ben dili</b> suçlamayı azaltır: <i><b>I feel</b> that the deadline was unclear.</i> (You never explain yerine). Yumuşatma: <b>I'm a bit concerned that…</b>, <b>Would it be possible to…?</b>`,
`concern=endişe|frankly=açıkçası|bring up=gündeme getirmek|address=ele almak|perspective=bakış açısı|conflict=çatışma|resolve=çözmek|tension=gerginlik|calm=sakin|intention=niyet|clear the air=havayı temizlemek|left out=dışlanmış`,
`I'd like to bring up something difficult.=Zor bir konuyu açmak istiyorum.|I'm a bit concerned about the deadlines.=Teslim tarihleri konusunda biraz endişeliyim.|I understand your perspective.=Bakış açını anlıyorum.|Let's try to resolve this calmly.=Bunu sakince çözmeye çalışalım.|Frankly, I felt left out.=Açıkçası kendimi dışlanmış hissettim.`,
`A:Do you have a minute? I'd like to bring up something.=Bir dakikan var mı? Bir konuyu açmak istiyorum.|B:Sure. What's going on?=Tabii. Ne oldu?|A:I felt that my work wasn't mentioned in the meeting.=Toplantıda emeğimden bahsedilmediğini hissettim.|B:Oh, I'm sorry. That wasn't my intention.=Ah, özür dilerim. Niyetim bu değildi.|A:I understand. I just wanted to clear the air.=Anlıyorum. Sadece havayı temizlemek istedim.|B:I appreciate that. I'll make sure the team knows it was your idea.=Bunu takdir ediyorum. Ekibin bunun senin fikrin olduğunu bilmesini sağlayacağım.`],
["B2","İş deyimleri","🏁",`Deyimler kelime kelime çevrilmez! <i>Piece of cake</i> = çok kolay (pasta dilimi değil). İş hayatında sık kullanılanları bilmek seni daha doğal gösterir, ama resmi yazılarda az kullan.`,
`piece of cake=çocuk oyuncağı|break the ice=buzları kırmak|on the same page=aynı noktada olmak|get the ball rolling=işi başlatmak|cut corners=kolaya kaçmak|back to square one=başa dönmek|call it a day=günü bitirmek|think outside the box=kalıpların dışında düşünmek|a long shot=zayıf ihtimal|win-win=iki taraf için kazançlı|the ball is in your court=top sende|hit the ground running=hızlı başlamak`,
`Let's get the ball rolling.=Hadi işe başlayalım.|Are we all on the same page?=Hepimiz aynı noktada mıyız?|It's a win-win deal.=İki taraf için de kazançlı bir anlaşma.|I think we should call it a day.=Bence bugünlük bu kadar.|Don't cut corners on quality.=Kalitede kolaya kaçma.`,
`A:So, are we all on the same page about the launch?=Lansman konusunda hepimiz aynı noktada mıyız?|B:Yes. The plan looks great. Let's get the ball rolling.=Evet. Plan harika görünüyor. Hadi başlayalım.|A:The investor wants a decision by Friday. The ball is in their court now.=Yatırımcı cumaya kadar karar istiyor. Top artık onlarda.|B:It's a long shot, but I think they'll say yes.=Zayıf ihtimal ama bence evet diyecekler.|A:Let's hope so. Otherwise, we're back to square one.=Umalım. Yoksa başa döneriz.|B:Okay, it's late. Let's call it a day.=Tamam, geç oldu. Bugünlük bu kadar.`]
);

🎤 Mülakatta | Where do you see yourself in five years? | Kendini beş yıl sonra nerede görüyorsun?
💼 İş ilanı | Apply now! Salary: competitive | Hemen başvur! Maaş: rekabetçi
# Networking :: Bir etkinlikte tanışıp iletişimde kalabilirsin.
💼 LinkedIn | Great meeting you at the event! Let's keep in touch. | Etkinlikte tanışmak harikaydı! İletişimde kalalım.
🗣️ Etkinlikte | So, what brings you here? | Peki, seni buraya ne getirdi?
📧 E-posta | I'd love to grab a coffee and catch up. | Bir kahve içip sohbet etmeyi çok isterim.
# Sözleşmeler :: Sözleşme maddelerini anlayıp değişiklik önerebilirsin.
🖥️ Kayıt ekranı | I agree to the Terms and Conditions | Şartlar ve Koşulları kabul ediyorum
📜 Sözleşmede | This agreement is legally binding. | Bu sözleşme yasal olarak bağlayıcıdır.
📧 E-posta | Please sign the NDA before our call. | Lütfen görüşmemizden önce gizlilik sözleşmesini imzalayın.
# Girişim finansı :: Nakit akışı, kârlılık ve finansman kararlarını tartışabilirsin.
🎧 Podcast | Revenue is vanity, profit is sanity, cash is king. | Gelir gösteriştir, kâr sağduyudur, nakit ise kraldır.
📊 Yatırımcı raporu | Net margin improved to 18%. | Net marj %18'e yükseldi.
📰 Haber | The startup shut down after running out of cash. | Girişim nakdi tükenince kapandı.
# Sunum yapmak :: Yapılandırılmış ve akıcı bir iş sunumu yapabilirsin.
🎤 Konferansta | Thank you all for being here today. | Bugün burada olduğunuz için hepinize teşekkürler.
🗣️ Toplantıda | Let me just share my slides. | Slaytlarımı paylaşayım.
🎤 Sunumda | Great question. That brings me to my next point. | Harika soru. Bu beni bir sonraki noktama getiriyor.
# Sürdürülebilirlik ve etik :: Sürdürülebilirlik ve etik konularda dengeli bir görüş savunabilirsin.
📦 Ambalajda | 100% recyclable packaging | %100 geri dönüştürülebilir ambalaj
📰 Haber | The brand was accused of greenwashing. | Marka yeşil aklamakla suçlandı.
💼 Sürdürülebilirlik raporu | We aim to be carbon neutral by 2030. | 2030'a kadar karbon nötr olmayı hedefliyoruz.
# Performans görüşmesi :: Performans görüşmesinde geri bildirim verip alabilir, zam ve terfi konuşabilirsin.
📧 İK e-postası | Your annual performance review is on Monday. | Yıllık performans değerlendirmeniz pazartesi.
💼 LinkedIn | Thrilled to share that I've been promoted to Team Lead! | Takım Lideri olarak terfi ettiğimi paylaşmaktan çok mutluyum!
🗣️ Birebir görüşmede | What support do you need from me? | Benden ne tür bir desteğe ihtiyacın var?
# Marka hikâyesi :: Markanın hikâyesini ve değerlerini etkileyici şekilde anlatabilirsin.
🛒 Hakkımızda sayfası | It all started in a small kitchen in 2019. | Her şey 2019'da küçük bir mutfakta başladı.
📱 Instagram | Handmade with love since 1985. | 1985'ten beri sevgiyle el yapımı.
🎧 Podcast | Your brand is what people say about you when you're not in the room. | Markan, sen odada yokken insanların senin hakkında söyledikleridir.
# Uluslararası büyüme :: Yurt dışına açılma planlarını ve süreçlerini anlatabilirsin.
🛒 Online mağaza | We now ship to over 30 countries. | Artık 30'dan fazla ülkeye gönderim yapıyoruz.
📰 Haber | The Turkish brand expanded into 12 European markets. | Türk markası 12 Avrupa pazarına açıldı.
🛒 Ödeme sayfası | Duties and taxes may apply. | Gümrük vergisi ve harçlar uygulanabilir.
# Yapay zekâ ve veri :: Yapay zekâ ve veri projelerini teknik terimlerle anlatabilirsin.
🖥️ Uygulamada | AI-generated content may contain errors. | Yapay zekâ tarafından üretilen içerik hata içerebilir.
💼 İş ilanı | Experience with Python and machine learning is a plus. | Python ve makine öğrenmesi deneyimi artı puandır.
📰 Haber | The new model was trained on billions of words. | Yeni model milyarlarca kelimeyle eğitildi.
# Değişim ve pivot :: Bir değişim sürecini gerekçeleriyle anlatıp ekibi ikna edebilirsin.
📰 Haber | The company pivoted from hardware to software. | Şirket donanımdan yazılıma yön değiştirdi.
📧 CEO'dan e-posta | Change is never easy, but it is necessary. | Değişim asla kolay değildir ama gereklidir.
🎧 Podcast | We've been working on this for two years. | İki yıldır bunun üzerinde çalışıyoruz.
# Haber ve medya dili :: Haber dilini ve manşetleri anlayıp kaynakları sorgulayabilirsin.
📰 Manşet | Tech Giant Cuts 1,000 Jobs | Teknoloji devi 1.000 kişiyi işten çıkarıyor
📰 Haber | According to sources close to the company... | Şirkete yakın kaynaklara göre...
📱 X (Twitter) | BREAKING: Central bank raises interest rates | SON DAKİKA: Merkez bankası faizleri artırdı
# Zor konuşmalar :: Zor bir konuyu sakin, net ve kırmadan konuşabilirsin.
💬 Slack | Can we talk privately for a few minutes? | Birkaç dakika özel konuşabilir miyiz?
📧 E-posta | I want to address the concerns you raised. | Dile getirdiğin endişeleri ele almak istiyorum.
🗣️ Birebir görüşmede | I hear you, and I want to fix this. | Seni duyuyorum ve bunu düzeltmek istiyorum.
# İş deyimleri :: İş hayatındaki yaygın deyimleri anlayıp doğal şekilde kullanabilirsin.
💬 Slack | Great work today. Let's call it a day! | Bugün harika iş çıkardık. Bugünlük bu kadar!
📧 E-posta | Just to make sure we're on the same page... | Aynı noktada olduğumuzdan emin olmak için...
💼 İş ilanı | We need someone who can hit the ground running. | İşe hızla ısınabilecek birini arıyoruz.

/* ---------- question generators ---------- */
const hasNum=t=>/\d/.test(t);
function qMcq(p,pool,dir){const ans=dir?p[0]:p[1];
  const cand=pool.filter(x=>x[0].toLowerCase()!==p[0].toLowerCase()&&x[1]!==p[1]);
  const wantNum=hasNum(ans),matched=cand.filter(x=>hasNum(dir?x[0]:x[1])===wantNum);
  let others=pick(matched,Math.min(3,matched.length));
  if(others.length<3){const used=new Set(others.map(o=>o[1]));others=others.concat(pick(cand.filter(x=>!used.has(x[1])),3-others.length))}
  return {t:"mcq",dir,prompt:dir?p[1]:p[0],ask:dir?"İngilizcesi hangisi?":"Bu ne demek?",answer:ans,opts:shuffle([ans,...others.map(o=>dir?o[0]:o[1])]),pair:p,speak:p[0]}}
function qListen(p,pool){const others=pick(pool.filter(x=>x[0].toLowerCase()!==p[0].toLowerCase()),3);return {t:"listen",answer:p[0],opts:shuffle([p[0],...others.map(o=>o[0])]),pair:p,speak:p[0]}}
function qBuild(p,pool){const tk=tokens(p[0]);const own=tk.map(norm);const extra=pick([...new Set(pool.flatMap(x=>tokens(x[0])).filter(w=>!own.includes(norm(w))))],2);
  return {t:"build",tr:p[1],answer:tk,bank:shuffle([...tk,...extra]),pair:p,speak:p[0]}}
function qFill(p,pool){const tk=tokens(p[0]);const cand=tk.map((w,i)=>[w,i]).filter(([w])=>/^[A-Za-z']+[.,!?]*$/.test(w)&&norm(w).length>=3);if(!cand.length)return null;
  const [w,i]=cand[Math.random()*cand.length|0];const ans=norm(w);const all=[...new Set(pool.flatMap(x=>tokens(x[0]).map(norm)).filter(x=>x.length>=2&&x!==ans))];
  if(all.length<3)return null;
  return {t:"fill",parts:[tk.slice(0,i).join(" "),w.replace(/^[A-Za-z']+/,""),tk.slice(i+1).join(" ")],tr:p[1],answer:ans,opts:shuffle([ans,...pick(all,3)]),pair:p,speak:p[0]}}
function qReply(d,extra){if(d.length<3)return null;const i=Math.random()*(d.length-1)|0;const ans=d[i+1].en;
  let others=d.filter((x,j)=>j!==i&&j!==i+1).map(x=>x.en);others=pick(others,3);if(others.length<3)others=others.concat(pick(extra.map(x=>x[0]).filter(x=>x!==ans),3-others.length));
  return {t:"reply",prev:d[i],pre:d.slice(0,i+1),answer:ans,opts:shuffle([ans,...others]),pair:[d[i+1].en,d[i+1].tr],speak:ans}}
function practiceSteps(items,dpool){const pool=dpool.length>=8?dpool:items.concat(ALLW);const it=pick(items,Math.min(items.length,10));const s=[];
  if(it.length>=4)s.push({t:"match",pairs:it.slice(0,5)});
  it.forEach((p,i)=>{const k=i%3;s.push(k===0?qMcq(p,pool,0):k===1?qMcq(p,pool,1):qListen(p,pool))});return s}
function buildLesson(L){
  const W=L.words,P=L.phr,D=L.dlg,s=[];const wp=W.concat(LESSONS[Math.max(0,L.id-2)].words);
  s.push({t:"intro",L});
  if(L.id>1){const pv=LESSONS[L.id-2];s.push({t:"info",h:"Hızlı tekrar",txt:`Önce önceki dersi hatırlayalım: <b>${pv.emoji} ${esc(pv.title)}</b>. Üç kısa soru, hazır mısın?`});
    const pw=pick(pv.words,3);s.push(qMcq(pw[0],pv.words,0),qMcq(pw[1],pv.words,1),qListen(pw[2],pv.words));
    const pp=pick(pv.phr,1)[0];s.push(qMcq(pp,pv.phr,0))}
  s.push({t:"flash",items:W,head:"Yeni kelimeler"});
  const sh=shuffle(W);
  s.push({t:"match",pairs:sh.slice(0,5)});
  s.push(qMcq(sh[0],W,0),qMcq(sh[1],W,1),qListen(sh[2],W),qMcq(sh[3],W,0),qMcq(sh[4],W,1));
  if(W.length>=8)s.push({t:"match",pairs:sh.slice(5,10).concat(sh.slice(0,Math.max(0,10-W.length)))});
  s.push({t:"phrases",items:P});
  const ps=shuffle(P);const short=ps.filter(p=>tokens(p[0]).length<=9);
  s.push(qMcq(ps[0],P,0));
  if(short[0])s.push(qBuild(short[0],P.concat(W)));
  s.push(qFill(ps[1],P.concat(D.map(d=>[d.en,d.tr]))));
  s.push(qListen(ps[2],P));
  if(short[1])s.push(qBuild(short[1],P.concat(W)));
  s.push(qMcq(ps[3],P,1));
  s.push({t:"dialog",items:D});
  s.push(qReply(D,P),qReply(D,P));
  if(L.real.length){s.push({t:"real",items:L.real});const rr=pick(L.real,2);
    s.push(qRealQ(rr[0],0));if(rr[1])s.push(qRealQ(rr[1],1))}
  if(short[2])s.push(qBuild(short[2],P.concat(W)));
  s.push(qFill(ps[4]||ps[0],P.concat(D.map(d=>[d.en,d.tr]))));
  return s.filter(Boolean);
}
function qRealQ(r,dir){const q=qMcq([r.en,r.tr],ALLREAL,dir);q.ctx=r.c;q.ask=dir?"Bunu İngilizce nasıl görürsün?":"Gerçek hayatta gördün. Ne demek?";return q}
function buildExam(k){const ls=lvLessons(k);const W=ls.flatMap(l=>l.words),P=ls.flatMap(l=>l.phr),RL=ls.flatMap(l=>l.real);
  const s=[{t:"info",h:`${k} Sınavı`,ic:"🏁",txt:`${ls.length} dersin tamamından <b>30 soru</b>. Yanlışlar tekrar gelmez, geçme notu <b>%${EXAM_PASS}</b>. Acele etme, her soruyu dikkatle oku. Başarılar!`}];
  const w=pick(W,12);w.slice(0,8).forEach((p,i)=>s.push(qMcq(p,W,i%2)));w.slice(8,12).forEach(p=>s.push(qListen(p,W)));
  const p=shuffle(P);const short=p.filter(x=>tokens(x[0]).length<=9&&tokens(x[0]).length>=3);
  p.slice(0,4).forEach((x,i)=>s.push(qMcq(x,P,i%2)));
  short.slice(0,4).forEach(x=>s.push(qBuild(x,P)));
  let f=0;for(const x of p.slice(4)){if(f>=3)break;const q=qFill(x,P);if(q){s.push(q);f++}}
  shuffle(ls).slice(0,4).forEach(l=>s.push(qReply(l.dlg,l.phr)));
  pick(RL,3).forEach((r,i)=>s.push(qRealQ(r,i===2?1:0)));
  const body=s.slice(1).filter(Boolean);return [s[0]].concat(body.slice(0,30).map(q=>Object.assign(q,{exam:true})))}
function startExam(k){run({title:k+" Sınavı",color:LV[k].c,steps:buildExam(k),exam:k,wrongs:[]})}
function startLesson(id){const L=LESSONS[id-1];run({title:L.title,color:LV[L.lv].c,steps:buildLesson(L),lesson:L})}

  ({intro:rIntro,info:rInfo,real:rReal,flash:rFlash,phrases:rPhrases,match:rMatch,mcq:rMcq,listen:rListen,fill:rFill,reply:rReply,build:rBuild,dialog:rDialog})[s.t](s,sb)}

function grade(ok,s,disp){
  if(ok){R.correct++;sfx("ok");if(s.pair&&st.wrong[s.pair[0]]){st.wrong[s.pair[0]][1]--;if(st.wrong[s.pair[0]][1]<=0)delete st.wrong[s.pair[0]];save()}}
  else{R.mis++;sfx("bad");if(s.pair){const w=st.wrong[s.pair[0]]||[s.pair[1],0];w[1]=Math.min(w[1]+1,3);st.wrong[s.pair[0]]=w;save()}
    if(R.wrongs)R.wrongs.push(s.pair||[disp,""]);
    if(!s.retry&&!R.exam)R.steps.push(Object.assign({},s,{retry:true,opts:s.opts&&shuffle(s.opts),bank:s.bank&&shuffle(s.bank)}))}
  foot("");
  fbShow(`<div class="fbi ${ok?"ok":"bad"}"><h3>${ok?"✓ "+PRAISE[Math.random()*PRAISE.length|0]:"✕ Doğru cevap:"}</h3>
  ${ok?"":`<p>${esc(disp)}</p>`}${s.pair?`<p class="pair">${esc(s.pair[0])} = ${esc(s.pair[1])}</p>`:""}

  if(after)after(ok);grade(ok,s,disp||s.answer)}));foot("")}
function rMcq(s,sb){sb.innerHTML=`<p class="q-ask">${s.ask}</p>${s.ctx?`<span class="ctx">${esc(s.ctx)}</span>`:""}<div class="q-big${s.ctx?" q-real":""}"><span>${esc(s.prompt)}</span>${s.dir?"":spkBtn(s.prompt)}</div>${optsHtml(s)}`;bindSay(sb);bindOpts(s,sb,null,()=>say(s.speak));if(!s.dir)say(s.prompt)}
function rListen(s,sb){sb.innerHTML=`<p class="q-ask">Dinle ve duyduğunu seç</p><div class="listen"><button class="bigspk" data-say="${esc(s.speak)}" aria-label="Dinle">${ICON.spk}</button><button class="slowb" data-say="${esc(s.speak)}" data-slow="1" aria-label="Yavaş dinle">🐢<span>Yavaş</span></button></div>${optsHtml(s)}`;bindSay(sb);bindOpts(s,sb);setTimeout(()=>say(s.speak),250)}
function rFill(s,sb){sb.innerHTML=`<p class="q-ask">Boşluğu doldur</p><div class="q-sent">${esc(s.parts[0])} <span class="blank" id="blk">&nbsp;</span>${esc(s.parts[1])} ${esc(s.parts[2])}</div><p class="muted" style="margin:0 0 16px">${esc(s.tr)}</p>${optsHtml(s)}`;
  bindOpts(s,sb,s.speak,()=>{$("#blk").textContent=s.answer;say(s.speak)})}
function rReply(s,sb){sb.innerHTML=`<p class="q-ask">Sohbete uygun cevabı seç</p><p class="muted small" style="margin-top:-8px">Önce diyaloğu oku, sırada ne söylenir?</p><div class="dlg" style="margin-bottom:18px">${s.pre.map((x,i)=>`<button class="bub ${x.s==="A"?"a":"b"} show" data-i="${i}"><span class="who">${x.s}</span>${esc(x.en)}<small class="tr">${esc(x.tr)}</small></button>`).join("")}</div>${optsHtml(s)}`;
  sb.querySelectorAll(".dlg .bub").forEach(b=>b.onclick=()=>{const d=s.pre[+b.dataset.i];say(d.en,{pitch:d.s==="A"?1.1:.85})});
  bindOpts(s,sb,null,()=>say(s.answer));const last=s.pre[s.pre.length-1];say(last.en,{pitch:last.s==="A"?1.1:.85})}
function rBuild(s,sb){let ch=[];
  sb.innerHTML=`<p class="q-ask">Cümleyi kur</p><div class="q-tr">🇹🇷 ${esc(s.tr)}</div><div class="ans" id="ans"></div><div class="bank" id="bank"></div>`;
  const draw=()=>{$("#ans").innerHTML=ch.map((i,k)=>`<button class="wchip" data-k="${k}">${esc(s.bank[i])}</button>`).join("");
    $("#bank").innerHTML=s.bank.map((w,i)=>`<button class="wchip ${ch.includes(i)?"used":""}" data-i="${i}">${esc(w)}</button>`).join("");
    $("#ans").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ch.splice(+b.dataset.k,1);draw()});
    $("#bank").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!ch.includes(i)){ch.push(i);draw()}});
    $("#chk").disabled=!ch.length};
  foot(`<button class="btn pri" id="chk" disabled>Kontrol et</button>`);
  $("#chk").onclick=()=>{const u=ch.map(i=>norm(s.bank[i])).join(" "),a=s.answer.map(norm).join(" ");const ok=u===a;say(s.speak);grade(ok,s,s.answer.join(" "))};
  draw()}
function rDialog(s,sb){let playing=false;
  sb.innerHTML=`<p class="q-ask">Diyalog</p><p class="muted small" style="margin-top:-8px">Baloncuğa dokun: sesli dinle ve Türkçesini gör.</p><button class="tgl" id="tAll">Tüm çevirileri göster</button>
  <div class="dlg" id="dl">${s.items.map((d,i)=>`<button class="bub ${d.s==="A"?"a":"b"}" data-i="${i}"><span class="who">${d.s==="A"?"A":"B"}</span>${esc(d.en)}<small class="tr">${esc(d.tr)}</small></button>`).join("")}</div>`;
  const bubs=[...sb.querySelectorAll(".bub")];
  bubs.forEach(b=>b.onclick=()=>{const d=s.items[+b.dataset.i];b.classList.add("show");say(d.en,{pitch:d.s==="A"?1.1:.85})});
  $("#tAll").onclick=()=>{const dl=$("#dl");dl.classList.toggle("alltr");$("#tAll").textContent=dl.classList.contains("alltr")?"Çevirileri gizle":"Tüm çevirileri göster"};
  foot(`<button class="btn ghost" id="pAll" style="flex:1">▶ Hepsini dinle</button><button class="btn pri" id="go" style="flex:1">Devam et</button>`);
  $("#go").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}next()};
  $("#pAll").onclick=()=>{if(playing){playing=false;try{speechSynthesis.cancel()}catch(e){}bubs.forEach(b=>b.classList.remove("play"));$("#pAll").textContent="▶ Hepsini dinle";return}
    playing=true;$("#pAll").textContent="■ Durdur";let k=0;
    const play=()=>{bubs.forEach(b=>b.classList.remove("play"));if(!playing||k>=bubs.length||!R){playing=false;const pa=$("#pAll");if(pa)pa.textContent="▶ Hepsini dinle";return}
      const b=bubs[k],d=s.items[k];b.classList.add("play");b.scrollIntoView({block:"nearest",behavior:"smooth"});k++;say(d.en,{pitch:d.s==="A"?1.1:.85,end:()=>setTimeout(play,350)})};
    play()}}
function finishExam(){R.finished=true;const k=R.exam;const tot=R.correct+R.mis;const pct=tot?Math.round(R.correct/tot*100):0;const pass=pct>=EXAM_PASS;
  const was=examPassed(k);st.exam=st.exam||{};st.exam[k]=Math.max(st.exam[k]||0,pct);const xp=pass?100+R.correct*2:20+R.correct;st.xp+=xp;bump();save();
  $("#stBar").style.width="100%";sfx(pass?"win":"bad");if(pass)confetti();
  const ki=LVK.indexOf(k),nk=LVK[ki+1];const nl=nk?lvLessons(nk)[0]:null;
  const wr=[];const seen=new Set();(R.wrongs||[]).forEach(p=>{if(p&&p[0]&&!seen.has(p[0])){seen.add(p[0]);wr.push(p)}});
  $("#sb").innerHTML=`<div class="res"><div class="bigscore ${pass?"ok":"no"}">%${pct}</div>
  <h2>${pass?(nk?`Tebrikler! ${k} seviyesini geçtin 🎓`:"Tebrikler! B2 seviyesini tamamladın 🎓"):"Bu sefer olmadı, ama çok yakınsın!"}</h2>
  <p class="muted">${pass?(nk?`${nk} ${LV[nk].n} hattı artık açık.${was?"":" Yeni kelimeler ve gerçek iş İngilizcesi seni bekliyor."}`:"Rotanın sonuna ulaştın. Dizilerle, podcastlerle ve gerçek konuşmalarla pratiğe devam et!"):`Geçmek için %${EXAM_PASS} gerekiyor. Aşağıdaki yanlışlarına göz at, zayıf kelimelerini tekrar et ve yeniden dene.`}</p>
  <div class="rs"><div><b>${R.correct}/${tot}</b><span>doğru</span></div><div><b>+${xp}</b><span>puan</span></div><div><b>%${st.exam[k]}</b><span>en iyi</span></div></div>
  ${wr.length?`<h3 class="grp" style="text-align:left">Tekrar etmen gerekenler (${wr.length})</h3><ul class="wl" style="text-align:left">${wr.map(p=>`<li><div class="tx"><div class="en">${esc(p[0])}</div><div class="tr">${esc(p[1]||"")}</div></div>${spkBtn(p[0])}</li>`).join("")}</ul>`:""}</div>`;
  bindSay($("#sb"));
  foot(`<div class="col">${pass&&nl?`<button class="btn pri" id="rN">${nk} seviyesine başla</button>`:""}${!pass?`<button class="btn pri" id="rA">Sınavı tekrar dene</button>`:""}<button class="btn ghost" id="rB">Rotaya dön</button></div>`);
  $("#rB").onclick=()=>{page="route";closeStage()};
  if($("#rN"))$("#rN").onclick=()=>{closeStage();startLesson(nl.id)};
  if($("#rA"))$("#rA").onclick=()=>{closeStage();startExam(k)}}
function finish(){if(R.exam)return finishExam();R.finished=true;const tot=R.correct+R.mis;const acc=tot?R.correct/tot:1;const stars=acc>=.9?3:acc>=.7?2:1;const xp=10+R.correct*2;
  st.xp+=xp;bump();if(R.lesson){st.done[R.lesson.id]=Math.max(st.done[R.lesson.id]||0,stars)}save();
  $("#stBar").style.width="100%";sfx("win");if(stars>=2)confetti();
  let nx=R.lesson&&R.lesson.id<N?LESSONS[R.lesson.id]:null;
  const lvEnd=R.lesson&&(!nx||nx.lv!==R.lesson.lv)&&!examPassed(R.lesson.lv)&&lvDone(R.lesson.lv)?R.lesson.lv:null;if(lvEnd)nx=null;
  $("#sb").innerHTML=`<div class="res"><div class="bigstars">${[1,2,3].map(i=>`<span class="${i<=stars?"":"off"}">★</span>`).join("")}</div>
  <h2>${stars===3?"Kusursuz!":stars===2?"Çok iyi iş!":"Tamamlandı!"}</h2><p class="muted">${R.lesson?`Ders ${R.lesson.id}: ${esc(R.lesson.title)} bitti.`:esc(R.title)+" bitti."}${stars<3&&R.lesson?" Üç yıldız için dersi tekrar edebilirsin.":""}</p>
  <div class="rs"><div><b>%${Math.round(acc*100)}</b><span>doğruluk</span></div><div><b>+${xp}</b><span>puan</span></div><div><b>🔥 ${streakNow()}</b><span>günlük seri</span></div></div></div>`;
  foot(`<div class="col">${lvEnd?`<button class="btn pri" id="rE">🏁 ${lvEnd} Sınavına geç</button>`:""}${nx?`<button class="btn pri" id="rN">Sonraki ders: ${esc(nx.title)}</button>`:""}<button class="btn ghost" id="rB">Rotaya dön</button></div>`);
  if(lvEnd)$("#rE").onclick=()=>{closeStage();startExam(lvEnd)};
  $("#rB").onclick=()=>{page="route";closeStage()};if(nx)$("#rN").onclick=()=>{const id=nx.id;closeStage();startLesson(id)}}

/* ---------- 60 second challenge ---------- */
function speedRun(){const pool=learned().length>=8?learned():LESSONS.slice(0,3).flatMap(l=>l.words);let score=0,t=60,lock=false;
  run({title:"60 saniye",color:"#D98300",steps:[{t:"info",h:"60 saniye",txt:"İngilizce kelimeyi gör, doğru Türkçesine dokun. Yanlış cevap 3 saniye kaybettirir. Hazırsan başla!"}]});
  foot(`<button class="btn pri" id="go">Başla</button>`);
  $("#go").onclick=()=>{R.steps=[{t:"x"}];$("#stBar").style.width="100%";const info=$("#stInfo");info.textContent="60";
    R.timer=setInterval(()=>{t--;info.textContent=Math.max(t,0);$("#stBar").style.width=(t/60*100)+"%";if(t<=0)end()},1000);q()};
  function q(){if(!R)return;const p=pool[Math.random()*pool.length|0];const s=qMcq(p,pool.length>=4?pool:ALLW,0);
    $("#sb").innerHTML=`<div class="spdq"><div class="spdscore">${score}</div><p class="muted" style="margin-top:0">doğru</p></div><div class="q-big"><span>${esc(s.prompt)}</span></div>${optsHtml(s)}`;foot("");lock=false;
    $("#sb").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const ok=s.opts[+b.dataset.i]===s.answer;b.classList.add(ok?"right":"wrong");
      if(ok){score++;sfx("ok")}else{t=Math.max(0,t-3);sfx("bad");$("#sb").querySelectorAll(".opt").forEach(x=>{if(s.opts[+x.dataset.i]===s.answer)x.classList.add("right")})}
      setTimeout(()=>{if(t>0)q()},ok?220:650)})}
  function end(){if(!R)return;clearInterval(R.timer);R.timer=null;R.finished=true;const best=score>st.best60;if(best)st.best60=score;st.xp+=score*2;if(score>0)bump();save();sfx("win");if(best&&score>0)confetti();
    $("#sb").innerHTML=`<div class="res"><div class="spdscore">${score}</div><h2>${best&&score>0?"Yeni rekor!":"Süre doldu!"}</h2><p class="muted">60 saniyede ${score} doğru. En iyi skorun: ${st.best60}</p><div class="rs"><div><b>+${score*2}</b><span>puan</span></div><div><b>${st.best60}</b><span>rekor</span></div><div><b>🔥 ${streakNow()}</b><span>seri</span></div></div></div>`;
    foot(`<div class="col"><button class="btn pri" id="again">Tekrar dene</button><button class="btn ghost" id="rB">Kapat</button></div>`);
    $("#again").onclick=()=>{closeStage();speedRun()};$("#rB").onclick=closeStage}
}

/* ---------- sheet & settings ---------- */
function openSheet(h){const s=$("#sheet");s.querySelector(".scard").innerHTML='<div class="grab"></div>'+h;s.hidden=false}
function closeSheet(){$("#sheet").hidden=true}
$("#sheet .sbg").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!$("#sheet").hidden)closeSheet();else if(R)askExit()}});
function settings(){
  const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-k="${k}" data-v="${v}" aria-pressed="${String(st[k])===String(v)}">${l}</button>`).join("")}</div>`;
  const sw=k=>`<button class="sw" role="switch" data-sw="${k}" aria-checked="${!!st[k]}"></button>`;
  openSheet(`<h2>Ayarlar</h2>
  <div class="set"><div><b>Tema</b><span>Açık, koyu ya da telefonuna göre</span></div>${seg("theme",[["auto","Oto"],["light","Açık"],["dark","Koyu"]])}</div>
  <div class="set"><div><b>Yavaş okuma</b><span>Tüm sesler daha yavaş okunur</span></div>${sw("slow")}</div>
  <div class="set"><div><b>Ses efektleri</b><span>Doğru ve yanlış cevap sesleri</span></div>${sw("sfx")}</div>
  <div class="set"><div><b>Tüm dersleri aç</b><span>Sıra beklemeden istediğin derse geç</span></div>${sw("unlock")}</div>
  <div class="set"><div><b>Sesi test et</b><span>${"speechSynthesis" in window?"Telefonun İngilizce sesini dinle":"Tarayıcın sesli okumayı desteklemiyor"}</span></div><button class="btn ghost" style="width:auto;min-height:40px" id="tst">🔊 Dinle</button></div>
  <div class="set"><div><b>İlerlemeyi sıfırla</b><span>Tüm dersler, puan ve seri silinir</span></div><button class="danger" id="rst">Sıfırla</button></div>
  <p class="small muted" style="margin-top:14px">İlerlemen sadece bu cihazda, bu tarayıcıda saklanır.</p>`);
  const sc=$("#sheet .scard");
  sc.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{st[b.dataset.k]=b.dataset.v;save();applyTheme();settings()});
  sc.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{const k=b.dataset.sw;st[k]=!st[k];save();b.setAttribute("aria-checked",st[k]);render()});
  $("#tst").onclick=()=>say("Hello! Let's learn English together.");
  let armed=false;$("#rst").onclick=e=>{if(!armed){armed=true;e.target.textContent="Emin misin? Tekrar dokun";return}
    const keep={theme:st.theme,sfx:st.sfx,slow:st.slow};st={done:{},xp:0,streak:0,last:null,wrong:{},unlock:false,best60:0,exam:{},v:2,...keep};save();closeSheet();render()}}
$("#bSet").addEventListener("click",settings);

/* ---------- boot ---------- */
render();
const cs=document.getElementById("curStop");if(cs&&Object.keys(st.done).length>2)setTimeout(()=>cs.scrollIntoView({block:"center"}),60);
})();
</script>
